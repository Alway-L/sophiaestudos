<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sophia">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#120D19">
<meta name="description" content="Sophia - Estudos: História, Geografia, Química e Inglês com resumos, flashcards, quizzes e jogos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23E0479A%22/%3E%3Ctext x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22 font-weight=%22bold%22%3ES%3C/text%3E%3C/svg%3E">
<title>Sophia - Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#120D19;--card:#1D1628;--ink:#F4EEF8;--mute:#A99FBC;--mute2:#CFC6DD;--line:#2F2640;--track:#2E2540;--plum:#E0479A;--plum2:#F472B6;--pinks:#3A1A33;--h:#E0663E;--hs:#3A2119;--g:#1A9E8A;--gs:#11302B;--q:#8B5CF6;--qs:#241B3D;--i:#3B82F6;--is:#16233F;--gold:#F5B942;--golds:#30251A;--ok:#3DCB7E;--oks:#132D1E;--bad:#F06767;--bads:#3A1A1E;--r:20px;--sh:0 1px 0 rgba(0,0,0,.2),0 10px 28px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent;padding-bottom:calc(88px + env(safe-area-inset-bottom));font-size:16px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}
b{font-weight:800}
.top{position:sticky;top:0;z-index:20;background:rgba(18,13,25,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-family:Fraunces,serif;font-weight:800;font-size:19px;color:var(--plum)}
.logo .mk{width:30px;height:30px;border-radius:10px;background:var(--plum);color:#fff;display:grid;place-items:center;font-size:16px}
.logo small{font-family:Nunito;font-weight:700;color:var(--mute);font-size:14px}
.pills{margin-left:auto;display:flex;gap:6px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 30px}
.hero{background:linear-gradient(135deg,#6B2A8C,#C7357F 60%,#E0479A);color:#fff;border-radius:26px;padding:24px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,220,.5),transparent 70%)}
.hero .eb{opacity:.8;font-weight:700}
.hero h1{font-size:40px;line-height:1.05;margin:2px 0 8px}
.hero p{opacity:.9;max-width:440px}
.lvl{margin-top:16px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px}
.lvl .bar{flex:1;height:10px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .6s}
.sec{font-size:22px;margin:28px 2px 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.big{background:var(--card);border-radius:var(--r);padding:16px;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px;transition:transform .15s;border:1px solid var(--line)}
.big:active{transform:scale(.97)}
.big .ic{font-size:26px;margin-bottom:4px}
.big b{font-size:16px}
.big small{color:var(--mute);font-weight:600;font-size:13px}
.big.gold{background:var(--golds);border-color:rgba(245,185,66,.35)}
.subj{border-radius:var(--r);padding:18px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh);min-height:150px}
.subj.h{background:var(--h)}.subj.g{background:var(--g)}
.subj .ic{font-size:30px}
.subj h3{font-size:22px}
.subj small{opacity:.9;font-weight:700}
.mini{height:7px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:auto}
.mini i{display:block;height:100%;background:var(--card);border-radius:9px}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.game{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--sh);display:flex;gap:12px;align-items:center}
.game .gi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.game b{display:block;font-size:15px;line-height:1.2}
.game small{color:var(--mute);font-weight:600;font-size:12.5px;line-height:1.3;display:block}
.tips{display:flex;flex-direction:column;gap:10px}
details.tip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
details.tip summary{font-weight:800;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary:after{content:"+";margin-left:auto;font-size:20px;color:var(--mute)}
details.tip[open] summary:after{content:"–"}
details.tip p{color:var(--mute2);margin-top:8px;font-size:15px}
.plan{background:var(--golds);border:1px dashed rgba(245,185,66,.45);border-radius:16px;padding:14px 16px;font-size:15px}
.plan ol{margin:6px 0 0 20px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--mute);margin-bottom:12px;padding:6px 0}
.shead{border-radius:24px;padding:22px;color:#fff;margin-bottom:16px}
.shead.h{background:var(--h)}.shead.g{background:var(--g)}
.shead h1{font-size:32px}
.shead p{opacity:.92;font-weight:600}
.tlist{display:flex;flex-direction:column;gap:10px}
.trow{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:14px;align-items:center;text-align:left;box-shadow:var(--sh)}
.trow .em{font-size:26px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.h .em,.trow.h .em{background:var(--hs)}.trow.g .em{background:var(--gs)}
.trow b{display:block;line-height:1.25}
.trow small{color:var(--mute);font-weight:600}
.ring{margin-left:auto;flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900}
.thead{border-radius:24px;padding:20px;margin-bottom:12px}
.thead.h{background:var(--hs)}.thead.g{background:var(--gs)}
.thead .k{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.thead.h .k{color:var(--h)}.thead.g .k{color:var(--g)}
.thead h1{font-size:28px;line-height:1.15;margin-top:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;position:sticky;top:58px;z-index:10}
.tab{flex:1;padding:9px 10px;border-radius:12px;font-weight:800;font-size:14px;white-space:nowrap;color:var(--mute)}
.tab.on{background:var(--plum);color:#fff}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.box h3{font-size:18px;margin-bottom:8px}
.box ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.box li{position:relative;padding-left:18px;font-size:15.5px}
.box li:before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.box.h b{color:var(--h)}.box.g b{color:var(--g)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:800;background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--plum);color:#fff;border-color:var(--plum)}
.btn.goldb{background:var(--gold);border-color:var(--gold);color:#3a2800}
.full{width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btns .btn{flex:1}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ghost{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:900;flex:none}
.pbar{flex:1;height:10px;background:var(--track);border-radius:9px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--plum2);border-radius:9px;transition:width .3s}
.count,.timer{font-weight:900;font-size:14px;white-space:nowrap}
.timer{background:var(--golds);padding:6px 10px;border-radius:10px}
.timer.low{background:var(--bads);color:var(--bad)}
.qcard{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--sh);border:1px solid var(--line)}
.qtag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:6px}
h2.q{font-size:21px;line-height:1.3;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15.5px;transition:all .15s}
.opt .l{width:30px;height:30px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-weight:900;flex:none;font-size:14px}
.opt:not(:disabled):active{transform:scale(.98)}
.opt.right{border-color:var(--ok);background:var(--oks)}.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bads)}.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.tfrow{flex-direction:row}.tfrow .opt{flex:1;justify-content:center;font-size:16px;padding:18px 8px;white-space:nowrap;gap:6px}
.exp{margin-top:14px;padding:14px;border-radius:14px;font-size:15px}
.exp.ok{background:var(--oks)}.exp.bad{background:var(--bads)}
.exp b{display:block;margin-bottom:2px}
#fb .btn{margin-top:12px}
.res{text-align:center;padding:10px 0}
.score{width:150px;height:150px;border-radius:50%;margin:10px auto 14px;display:grid;place-items:center;background:conic-gradient(var(--plum2) calc(var(--p)*1%),var(--track) 0)}
.score div{width:122px;height:122px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:Fraunces,serif;font-weight:800;font-size:38px}
.res h2{font-size:26px}
.res p{color:var(--mute);font-weight:600}
.rev{text-align:left;margin-top:18px}
.rev .item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.rev .item .a{color:var(--ok);font-weight:800;margin:4px 0}
.rev .item .x{color:var(--mute2)}
.report{display:flex;flex-direction:column;gap:8px;text-align:left;margin-top:16px}
.report .r{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px}
.report .r span{margin-left:auto;font-weight:900}
.flip{perspective:1200px;margin:6px 0 14px;cursor:pointer}
.flip .fc{position:relative;min-height:260px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fc{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--sh)}
.face.f{background:var(--card);border:1px solid var(--line)}
.face.b{background:var(--plum);color:#fff;transform:rotateY(180deg)}
.face .t{font-family:Fraunces,serif;font-size:26px;font-weight:800;line-height:1.2}
.face .d{font-size:19px;font-weight:700;line-height:1.35}
.face small{position:absolute;bottom:14px;font-weight:700;opacity:.6;font-size:13px}
.face .tg{position:absolute;top:14px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.6}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate .btn{padding:15px}
.rate .no{background:var(--bads);border-color:rgba(240,103,103,.4);color:var(--bad)}
.rate .yes{background:var(--oks);border-color:rgba(61,203,126,.4);color:var(--ok)}
.why{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.why h3{font-size:18px;line-height:1.3;margin-bottom:10px}
.why textarea{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:15px;background:var(--bg);resize:vertical}
.why .ans{margin-top:10px;background:var(--golds);border-radius:12px;padding:12px;font-size:15px;display:none}
.why.show .ans{display:block}
.chips{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.chip{padding:16px;border-radius:16px;font-weight:800;font-size:16px;text-align:left;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line)}
.chip .em{font-size:24px}
.chip.h{border-color:rgba(224,102,62,.5)}.chip.g{border-color:rgba(26,158,138,.55)}
.intro{color:var(--mute);font-weight:600}
.tl{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.tli{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;font-weight:700;transition:all .2s}
.tli .yr{font-family:Fraunces,serif;font-weight:800;color:var(--plum2);min-width:48px;display:none}
.tl.done .yr{display:block}
.tli .mv{margin-left:auto;display:flex;gap:4px}
.tli .mv button{width:36px;height:36px;border-radius:10px;background:var(--bg);font-weight:900}
.tli.ok{border-color:var(--ok);background:var(--oks)}.tli.bad{border-color:var(--bad);background:var(--bads)}
.pairs{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;margin-top:14px}
.pcol{display:flex;flex-direction:column;gap:8px}
.pc{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px;font-weight:700;font-size:14px;text-align:left;min-height:58px;line-height:1.3;transition:all .15s}
.pc.term{font-family:Fraunces,serif;font-weight:800;font-size:15px}
.pc.sel{border-color:var(--plum2);background:var(--pinks)}
.pc.ok{border-color:var(--ok);background:var(--oks);opacity:.6}
.pc.no{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
nav.bot{position:fixed;bottom:0;left:0;right:0;background:rgba(18,13,25,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.bot .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.bot button{padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:800;color:var(--mute)}
nav.bot button span{font-size:21px;filter:grayscale(1);opacity:.7}
nav.bot button.on{color:var(--plum)}
nav.bot button.on span{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--plum);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;transition:all .3s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.empty{text-align:center;padding:30px 10px;color:var(--mute);font-weight:700}
.read{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:800}
@media (max-width:420px){.games{grid-template-columns:1fr}.hero h1{font-size:34px}h2.q{font-size:19px}}

body{position:relative}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.38;mix-blend-mode:screen}
.bgfx .b1{width:420px;height:420px;background:#EC4899;top:-120px;left:-120px;animation:drift1 22s ease-in-out infinite alternate}
.bgfx .b2{width:360px;height:360px;background:#F472B6;bottom:-140px;right:-100px;animation:drift2 26s ease-in-out infinite alternate}
.bgfx .b3{width:300px;height:300px;background:#C026D3;top:40%;left:55%;opacity:.22;animation:drift3 30s ease-in-out infinite alternate}
.bgfx .b4{width:240px;height:240px;background:#FB7185;top:60%;left:-80px;opacity:.25;animation:drift2 34s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(45vw,35vh) scale(1.25)}}
@keyframes drift2{to{transform:translate(-40vw,-45vh) scale(1.15)}}
@keyframes drift3{to{transform:translate(-35vw,25vh) scale(.8)}}
.bgfx .dot{position:absolute;bottom:-20px;border-radius:50%;background:#F9A8D4;box-shadow:0 0 10px #F472B6;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.8}90%{opacity:.6}100%{transform:translateY(-110vh) translateX(40px);opacity:0}}
.bgfx .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(244,114,182,.12) 1px,transparent 1px);background-size:26px 26px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
.hero,.subj,.shead{box-shadow:0 12px 34px -14px rgba(236,72,153,.55)}
.opt.right .l,.opt.wrong .l{color:#120D19}
@media (prefers-reduced-motion:reduce){.bgfx *{animation:none!important}}

.subj.q,.shead.q{background:var(--q)}
.thead.q{background:var(--qs)}.thead.q .k{color:#C4B5FD}
.trow.q .em{background:var(--qs)}
.box.q b{color:#C4B5FD}
.chip.q{border-color:rgba(139,92,246,.6)}
.subjs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subjs .subj:nth-child(odd):last-child{grid-column:1/-1;min-height:auto}
.mnem{background:linear-gradient(135deg,rgba(224,71,154,.18),rgba(139,92,246,.18));border:1px solid rgba(244,114,182,.4);border-radius:18px;padding:16px 18px;margin-bottom:12px;font-size:15.5px}
.mnem .mt{font-weight:900;color:var(--plum2);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.mnem b{color:#FBCFE8}
nav.bot button{font-size:11px}

.subj.i,.shead.i{background:var(--i)}
.thead.i{background:var(--is)}.thead.i .k{color:#93C5FD}
.trow.i .em{background:var(--is)}
.box.i b{color:#93C5FD}
.chip.i{border-color:rgba(59,130,246,.6)}
.pass{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--i);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.55;margin-bottom:14px;color:var(--mute2)}
.pass b{color:var(--ink)}
.vbase{font-family:Fraunces,serif;font-size:40px;font-weight:800;text-align:center}
.vpt{text-align:center;color:var(--mute);font-weight:700;margin-bottom:16px}
.vin{width:100%;font:inherit;font-size:22px;font-weight:800;text-align:center;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.vin:focus{border-color:var(--plum2)}
.vin.ok{border-color:var(--ok);background:var(--oks)}.vin.bad{border-color:var(--bad);background:var(--bads)}

.top{padding-top:env(safe-area-inset-top)}
.top .in,.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.gear{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--mute2)}

{id:'gf',s:'h',t:'Guerra Fria',e:'🚀',per:'1947–1991',
sum:[
["O que foi",["Disputa entre <b>EUA</b> (capitalismo) e <b>URSS</b> (socialismo) de 1947 a 1991.","Chamada de 'fria' porque as duas superpotências <b>nunca se enfrentaram diretamente</b> — o medo de uma guerra nuclear impedia.","O mundo ficou <b>bipolar</b>: dividido em dois blocos."]],
["Os dois lados",["EUA: <b>Doutrina Truman</b> (conter o comunismo) e <b>Plano Marshall</b> (ajuda econômica para reconstruir a Europa Ocidental).","URSS: <b>Comecon</b> (ajuda econômica ao bloco socialista).","Alianças militares: <b>OTAN</b> (1949, EUA e aliados) x <b>Pacto de Varsóvia</b> (1955, URSS e aliados)."]],
["Símbolos",["A Alemanha foi dividida em Ocidental (capitalista) e Oriental (socialista).","O <b>Muro de Berlim</b> (1961–1989) foi o maior símbolo da divisão.","<b>Corrida armamentista</b> (bombas atômicas) e <b>corrida espacial</b>: Sputnik (1957, URSS), Gagarin no espaço (1961, URSS) e o homem na Lua (1969, EUA)."]],
["Conflitos indiretos",["<b>Guerra da Coreia</b> (1950–1953): Coreia dividida em Norte (socialista) e Sul (capitalista).","<b>Revolução Cubana</b> (1959) e <b>Crise dos Mísseis</b> (1962): o mundo esteve perto de uma guerra nuclear.","<b>Guerra do Vietnã</b> (até 1975): derrota dos EUA.","Na América Latina, os EUA apoiaram <b>ditaduras militares</b>, como a do Brasil (a partir de 1964)."]],
["O fim",["Anos 1980: crise econômica na URSS.","<b>Gorbachev</b> lançou a <b>Perestroika</b> (reformas econômicas) e a <b>Glasnost</b> (abertura política).","1989: <b>queda do Muro de Berlim</b>; 1990: reunificação da Alemanha.","Dezembro de 1991: <b>fim da URSS</b>. Os EUA ficam como única superpotência."]]],
cards:[["Bipolaridade","Mundo dividido entre EUA e URSS"],["Plano Marshall","Ajuda econômica dos EUA para reconstruir a Europa"],["OTAN","Aliança militar liderada pelos EUA (1949)"],["Pacto de Varsóvia","Aliança militar liderada pela URSS (1955)"],["Muro de Berlim","Símbolo da divisão, de 1961 a 1989"],["Crise dos Mísseis","1962: mísseis soviéticos em Cuba"],["Perestroika","Reformas econômicas de Gorbachev"],["Glasnost","Abertura política e transparência na URSS"]],
quiz:[
["Por que a Guerra Fria recebeu esse nome?","As superpotências não se enfrentaram diretamente",["Aconteceu só no inverno","Foi travada no Polo Norte","Não houve nenhum conflito armado no mundo"],"Houve conflitos indiretos (Coreia, Vietnã), mas EUA e URSS nunca guerrearam entre si."],
["O que foi o Plano Marshall?","Ajuda econômica dos EUA para a Europa Ocidental",["Um plano soviético para invadir a Europa","O acordo que criou a ONU","O projeto do Muro de Berlim"],"Reconstruir a Europa também servia para impedir o avanço do socialismo."],
["Qual aliança militar foi criada pela URSS e seus aliados?","Pacto de Varsóvia",["OTAN","Mercosul","União Europeia"],"Foi a resposta soviética à OTAN, em 1955."],
["Qual evento de 1962 quase levou a uma guerra nuclear?","Crise dos Mísseis em Cuba",["Queda do Muro de Berlim","Guerra da Coreia","Chegada do homem à Lua"],"A URSS instalou mísseis em Cuba, muito perto dos EUA."],
["O que foi a Perestroika?","Reformas econômicas promovidas por Gorbachev",["Uma corrida espacial","Um tratado de paz entre EUA e Cuba","Um muro construído na Alemanha"],"Junto com a Glasnost, tentou salvar a URSS, mas acelerou seu fim."],
["Em que ano a União Soviética deixou de existir?","1991",["1945","1961","2001"],"Em dezembro de 1991, marcando o fim da Guerra Fria."],
["Qual país saiu derrotado da Guerra do Vietnã?","Estados Unidos",["União Soviética","China","Coreia do Norte"],"Em 1975 o Vietnã foi unificado sob governo socialista."]],
tf:[["EUA e URSS lutaram diretamente várias vezes durante a Guerra Fria.",false,"Nunca se enfrentaram diretamente: disputavam por meio de outros países."],["O primeiro ser humano a ir ao espaço era soviético.",true,"Yuri Gagarin, em 1961. O primeiro a pisar na Lua foi o americano Neil Armstrong, em 1969."],["A Coreia continua dividida em Norte e Sul até hoje.",true,"A Guerra da Coreia terminou em 1953 com um armistício, e a divisão permanece."],["O Muro de Berlim caiu em 1991.",false,"O Muro caiu em 1989. Em 1991 o que acabou foi a URSS."]],
why:[["Por que a corrida espacial era importante na Guerra Fria?","Porque mostrava qual sistema era mais avançado. Além disso, a tecnologia de foguetes também servia para mísseis militares."],["Como a Guerra Fria afetou o Brasil?","Os EUA queriam evitar o socialismo na América Latina e apoiaram governos alinhados a eles. O golpe militar de 1964 aconteceu nesse clima de medo do comunismo."]]},

{id:'glo',s:'h',t:'Globalização',e:'🌐',per:'Anos 1990 até hoje',

["Fluxos",["Circulação rápida de <b>mercadorias, capitais, informações e pessoas</b>.","<b>Empresas transnacionais</b> espalham a produção pelo mundo: um celular pode ser projetado nos EUA, ter peças da Coreia e ser montado na China.","O mercado financeiro funciona 24 horas: o dinheiro muda de país em segundos."]],

["Blocos e organizações",["<b>Blocos econômicos</b>: União Europeia, Mercosul (1991), acordo EUA-México-Canadá (antigo NAFTA).","<b>OMC</b> (1995): regula o comércio internacional.","Também o FMI e o Banco Mundial."]],

cards:[["Globalização","Integração econômica, cultural e de comunicação entre países"],["Empresa transnacional","Empresa que atua e produz em vários países"],["Neoliberalismo","Defende pouca intervenção do Estado na economia"],["Mercosul","Bloco econômico da América do Sul, criado em 1991"],["OMC","Organização Mundial do Comércio (1995)"],["Exclusão digital","Falta de acesso à internet e à tecnologia"],["Terceira Revolução Industrial","Revolução técnico-científico-informacional: informática e telecomunicações"]],
quiz:[

["O que defende o neoliberalismo?","Pouca intervenção do Estado na economia",["Estado controlando todas as empresas","Fim do comércio internacional","Volta da monarquia"],"Privatizações e abertura de mercados são marcas do neoliberalismo."],
["O que é uma empresa transnacional?","Uma empresa que atua em vários países",["Uma empresa estatal brasileira","Uma loja que só vende pela internet","Uma cooperativa de agricultores locais"],"Ex.: grandes marcas de celulares, carros e refrigerantes."],

tf:[["A globalização distribuiu a riqueza igualmente entre todos os países.",false,"Pelo contrário: muitas vezes aumentou as desigualdades."],["Ver as mesmas marcas e músicas no mundo todo é um exemplo de padronização cultural.",true,"É um dos efeitos culturais da globalização."],["O neoliberalismo defende mais empresas estatais.",false,"Defende privatizações e menos Estado na economia."],["O Fórum Social Mundial surgiu como crítica à globalização neoliberal.",true,"A primeira edição foi em Porto Alegre, em 2001."]],
why:[["Por que um celular pode ser 'de vários países'?","Porque as transnacionais dividem a produção onde for mais barato ou vantajoso: projeto num país, peças em outros e montagem onde a mão de obra custa menos."],["A globalização é boa ou ruim?","Tem os dois lados: facilita o acesso a informação, tecnologia e produtos, mas pode aumentar a desigualdade, o desemprego em alguns setores e a perda de culturas locais."]]},

{id:'cin',s:'q',t:'Rapidez das reações',e:'🔥',per:'Química A · Fatores que alteram a rapidez',
mnem:"Os 5 fatores: <b>'Todo Cientista Sabe Preparar Café'</b> = <b>T</b>emperatura, <b>C</b>oncentração, <b>S</b>uperfície de contato, <b>P</b>ressão e <b>C</b>atalisador. Todos aceleram a reação quando aumentam!",
sum:[
["O que é rapidez de reação",["É a <b>variação da quantidade</b> de reagente consumido (ou de produto formado) num intervalo de tempo.","v = |Δquantidade| ÷ Δt (ex.: mol/L·s).","<b>Teoria das Colisões</b>: para reagir, as partículas precisam se <b>chocar</b> com <b>energia suficiente</b> e na <b>orientação certa</b> (choque efetivo)."]],
["Energia de ativação",["<b>Energia de ativação (Ea)</b>: energia mínima para a reação começar.","No topo do gráfico de energia fica o <b>complexo ativado</b>, um estado intermediário instável.","Quanto <b>menor a Ea</b>, <b>mais rápida</b> a reação."]],
["Os 5 fatores",["<b>Temperatura</b>: ↑ temperatura → partículas mais agitadas → mais choques efetivos → mais rapidez.","<b>Concentração</b>: ↑ concentração dos reagentes → mais partículas → mais choques → mais rapidez.","<b>Superfície de contato</b>: sólido mais dividido (em pó) = maior superfície = mais rapidez. Ex.: comprimido efervescente triturado.","<b>Pressão</b> (gases): ↑ pressão → partículas mais próximas → mais rapidez.","<b>Catalisador</b>: <b>diminui a energia de ativação</b> criando um caminho alternativo e <b>não é consumido</b>. Ex.: enzimas do corpo, catalisador do escapamento do carro."]],
["Lei da velocidade",["v = k·[A]ᵃ·[B]ᵇ (k = constante de velocidade).","Em reações de uma etapa (elementares), os expoentes são os coeficientes da equação.","Em reações com várias etapas, quem manda é a <b>etapa lenta</b>."]],
["Atenção na prova",["O catalisador <b>não altera</b> o ΔH nem a quantidade de produto formado: só acelera.","<b>Inibidor</b>: diminui a rapidez (ex.: conservantes de alimentos).","A geladeira conserva alimentos porque a <b>baixa temperatura</b> deixa as reações de decomposição mais lentas."]]],
cards:[["Energia de ativação","Energia mínima para a reação começar"],["Catalisador","Diminui a energia de ativação e não é consumido"],["Superfície de contato","Quanto mais dividido o sólido, mais rápida a reação"],["Teoria das Colisões","A reação exige choques com energia e orientação adequadas"],["Complexo ativado","Estado intermediário instável no topo do gráfico de energia"],["Inibidor","Substância que diminui a rapidez de uma reação"],["Etapa lenta","Determina a velocidade de uma reação com várias etapas"],["Enzimas","Catalisadores biológicos"]],
quiz:[
["Por que os alimentos duram mais na geladeira?","A baixa temperatura diminui a rapidez das reações de decomposição",["O frio elimina a energia de ativação","O frio funciona como catalisador","A geladeira aumenta a superfície de contato"],"Com temperatura menor, as partículas se chocam menos e com menos energia."],
["Qual é o papel de um catalisador?","Diminuir a energia de ativação, acelerando a reação",["Aumentar a energia de ativação","Aumentar a quantidade de produto formado","Ser consumido como reagente"],"Ele cria um caminho alternativo com Ea menor e é recuperado no final."],
["Um comprimido efervescente reage mais rápido quando está:","Triturado em pó",["Inteiro","Em água gelada","Embrulhado no papel"],"Em pó, a superfície de contato com a água é muito maior."],
["Aumentar a concentração dos reagentes faz a reação:","Ficar mais rápida, pois aumenta o número de choques",["Ficar mais lenta","Parar completamente","Não mudar nada"],"Mais partículas no mesmo espaço = mais colisões."],
["O que um catalisador NÃO altera?","O ΔH (variação de entalpia) da reação",["A energia de ativação","A rapidez da reação","O caminho da reação"],"A energia dos reagentes e dos produtos continua a mesma; só o 'caminho' muda."],
["Numa reação com várias etapas, qual etapa determina a velocidade?","A etapa mais lenta",["A etapa mais rápida","Sempre a primeira","Sempre a última"],"É como um gargalo: a reação toda anda na velocidade da etapa lenta."],
["Pela Teoria das Colisões, um choque efetivo precisa ter:","Energia suficiente e orientação adequada",["Apenas muita velocidade","Apenas a presença de luz","Partículas do mesmo tamanho"],"Sem energia mínima ou na posição errada, as partículas só batem e se afastam."]],
tf:[["O catalisador é consumido durante a reação.",false,"Ele participa, mas é regenerado no final e pode ser reaproveitado."],["Aumentar a temperatura geralmente aumenta a rapidez das reações.",true,"As partículas ficam mais agitadas e os choques efetivos aumentam."],["Lenha em lascas queima mais rápido que um tronco inteiro.",true,"As lascas têm maior superfície de contato com o oxigênio."],["Quanto maior a energia de ativação, mais rápida é a reação.",false,"É o contrário: Ea maior = mais difícil começar = reação mais lenta."]],
why:[["Por que mastigar bem ajuda na digestão?","Mastigar divide o alimento em pedaços menores, aumentando a superfície de contato com as enzimas (catalisadores). Assim as reações da digestão ficam mais rápidas."],["Por que o palito de fósforo precisa ser riscado para acender?","O atrito fornece a energia de ativação. Depois que a reação começa, ela mesma libera calor suficiente para continuar."]]},

{id:'iso',s:'q',t:'Isomeria',e:'🪞',per:'Química A · Isomeria plana e espacial',
mnem:"Isomeria plana: <b>'Cada Posição Funciona Muito Tranquila'</b> = <b>C</b>adeia, <b>P</b>osição, <b>F</b>unção, <b>M</b>etameria, <b>T</b>automeria. Óptica: procure o carbono com <b>4 vizinhos diferentes</b> (C*). Cis = <b>mesmo lado</b>; Trans = <b>atravessado</b>.",
sum:[
["O que é",["<b>Isômeros</b>: compostos com a <b>mesma fórmula molecular</b>, mas <b>estruturas diferentes</b> — por isso têm propriedades diferentes.","Ex.: C₂H₆O pode ser o <b>etanol</b> (CH₃–CH₂–OH, um álcool) ou o <b>metoximetano</b> (CH₃–O–CH₃, um éter).","Dois grandes tipos: <b>plana</b> (estrutural) e <b>espacial</b> (geométrica e óptica)."]],
["Isomeria plana",["<b>De cadeia</b>: muda o tipo de cadeia (aberta x fechada, normal x ramificada). Ex.: butano x metilpropano.","<b>De posição</b>: mesma função e cadeia, mas muda a posição de um grupo, ramificação ou ligação dupla. Ex.: propan-1-ol x propan-2-ol.","<b>De função</b>: funções orgânicas diferentes. Ex.: álcool x éter; aldeído x cetona; ácido carboxílico x éster.","<b>Metameria (compensação)</b>: muda a posição do <b>heteroátomo</b> (O, N ou S entre carbonos). Ex.: CH₃–O–CH₂–CH₂–CH₃ x CH₃–CH₂–O–CH₂–CH₃.","<b>Tautomeria</b>: isômeros que se transformam um no outro em equilíbrio. Ex.: enol ⇌ aldeído ou cetona."]],
["Isomeria geométrica (cis-trans)",["Ocorre em <b>dupla ligação</b> (C=C) ou em <b>cadeia fechada</b>, onde os carbonos não giram livremente.","Condição: cada carbono da dupla precisa ter <b>dois ligantes diferentes</b> entre si.","<b>Cis</b>: ligantes iguais do <b>mesmo lado</b>. <b>Trans</b>: ligantes iguais em <b>lados opostos</b>.","Ex.: cis-but-2-eno e trans-but-2-eno."]],
["Isomeria óptica",["Ocorre quando há <b>carbono quiral</b> (assimétrico, C*): carbono ligado a <b>4 ligantes diferentes</b>.","A molécula e sua imagem no espelho <b>não se sobrepõem</b>, como as mãos direita e esquerda: são os <b>enantiômeros</b>.","Desviam a luz polarizada: <b>dextrogiro (+)</b> para a direita e <b>levogiro (–)</b> para a esquerda.","Mistura com 50% de cada: <b>mistura racêmica</b>, que não desvia a luz (opticamente inativa).","Número de isômeros ópticos ativos = <b>2ⁿ</b> (n = número de carbonos quirais diferentes)."]]],
cards:[["Isômeros","Mesma fórmula molecular, estruturas diferentes"],["Isomeria de função","Funções orgânicas diferentes (ex.: álcool x éter)"],["Isomeria de posição","Muda a posição de um grupo, ramificação ou ligação dupla"],["Metameria","Muda a posição do heteroátomo na cadeia"],["Tautomeria","Isômeros em equilíbrio dinâmico (ex.: enol ⇌ cetona)"],["Cis / Trans","Ligantes iguais do mesmo lado / em lados opostos"],["Carbono quiral","Carbono ligado a 4 ligantes diferentes"],["Mistura racêmica","50% dextrogiro + 50% levogiro; não desvia a luz"]],
quiz:[
["O que dois isômeros têm em comum?","A mesma fórmula molecular",["A mesma estrutura","As mesmas propriedades físicas","O mesmo nome"],"Mesma fórmula, mas os átomos estão organizados de jeitos diferentes."],
["Etanol (CH₃–CH₂–OH) e metoximetano (CH₃–O–CH₃) são isômeros de:","Função",["Cadeia","Posição","Tautomeria"],"Um é álcool e o outro é éter: funções diferentes."],
["Propan-1-ol e propan-2-ol são isômeros de:","Posição",["Função","Metameria","Cadeia"],"A função (álcool) é a mesma; muda só a posição do –OH."],
["Qual a condição para existir isomeria cis-trans em alcenos?","Cada carbono da dupla ter dois ligantes diferentes",["Ter um carbono com 4 ligantes diferentes","Ter apenas ligações simples","Ter um heteroátomo"],"Se um carbono da dupla tiver dois ligantes iguais, não existe cis-trans."],
["O que é um carbono quiral?","Um carbono ligado a 4 ligantes diferentes",["Um carbono com dupla ligação","Um carbono ligado só a hidrogênios","Qualquer carbono de um anel"],"Ele é a causa da isomeria óptica."],
["Uma molécula com 2 carbonos quirais diferentes tem quantos isômeros ópticos ativos?","4",["2","6","8"],"Pela fórmula 2ⁿ: 2² = 4."],
["Qual tipo de isomeria envolve isômeros em equilíbrio dinâmico?","Tautomeria",["Metameria","Isomeria de cadeia","Isomeria cis-trans"],"Ex.: o enol se converte em aldeído ou cetona, e vice-versa."]],
tf:[["Isômeros sempre têm as mesmas propriedades físicas e químicas.",false,"Como as estruturas são diferentes, as propriedades também mudam."],["Na forma trans, os ligantes iguais ficam em lados opostos da dupla ligação.",true,"Trans = 'através', do outro lado. Cis = do mesmo lado."],["Uma mistura racêmica desvia a luz polarizada para a direita.",false,"Ela é opticamente inativa: um enantiômero cancela o desvio do outro."],["Butano e metilpropano são isômeros de cadeia.",true,"Os dois são C₄H₁₀; um tem cadeia normal e o outro, ramificada."]],
why:[["Por que a isomeria óptica é importante para os remédios?","Os dois enantiômeros podem agir de forma diferente no corpo: um pode tratar a doença e o outro não ter efeito ou até fazer mal. Por isso a indústria farmacêutica separa os isômeros."],["Por que alcenos podem ter cis-trans, mas alcanos de cadeia aberta não?","Porque a dupla ligação impede que os carbonos girem, deixando os ligantes 'presos' de um lado ou do outro. Na ligação simples, os carbonos giram livremente."]]},

{id:'adsub',s:'q',t:'Reações de adição e substituição',e:'🔄',per:'Química A · Reações orgânicas',
mnem:"<b>Adição</b> = 'abre a dupla e soma' (nada sai). <b>Substituição</b> = 'sai um, entra outro'. Regra de Markovnikov: <b>'o rico fica mais rico'</b> — o H vai para o carbono da dupla que já tem mais hidrogênios.",
sum:[
["Reações de substituição",["Um átomo ou grupo <b>sai</b> da molécula e <b>outro entra</b> no lugar.","Típicas de <b>alcanos</b> e de <b>aromáticos</b> (benzeno), compostos mais estáveis.","<b>Halogenação de alcanos</b>: CH₄ + Cl₂ → CH₃Cl + HCl (com luz ou calor).","Em alcanos maiores, o H substituído preferencialmente é o do carbono <b>terciário > secundário > primário</b>."]],
["Substituição em aromáticos",["<b>Halogenação</b>: benzeno + Cl₂ → clorobenzeno + HCl (catalisador FeCl₃).","<b>Nitração</b>: benzeno + HNO₃ → nitrobenzeno + H₂O (catalisador H₂SO₄).","<b>Sulfonação</b>: benzeno + H₂SO₄ → ácido benzenossulfônico + H₂O.","<b>Friedel-Crafts</b> (alquilação e acilação): entra um grupo alquila ou acila (catalisador AlCl₃).","Grupos já presentes no anel orientam a entrada do novo: –OH, –NH₂, –CH₃ e halogênios → <b>orto e para</b>; –NO₂, –COOH, –SO₃H → <b>meta</b>."]],
["Reações de adição",["A <b>ligação dupla ou tripla se quebra</b> e átomos se <b>somam</b> à molécula — nada sai.","Típicas de <b>alcenos</b> e <b>alcinos</b> (compostos insaturados).","<b>Hidrogenação</b>: CH₂=CH₂ + H₂ → CH₃–CH₃ (catalisador Ni, Pt ou Pd). Usada para fazer margarina.","<b>Halogenação</b>: CH₂=CH₂ + Br₂ → CH₂Br–CH₂Br. A água de bromo (avermelhada) <b>perde a cor</b>: é o teste para identificar duplas e triplas.","<b>Hidratação</b>: alceno + H₂O → álcool (em meio ácido).","<b>Adição de HX</b> (HCl, HBr): forma haleto orgânico."]],
["Regra de Markovnikov",["Na adição de HX ou H₂O a um alceno assimétrico, o <b>H vai para o carbono da dupla mais hidrogenado</b>.","Ex.: CH₂=CH–CH₃ + HCl → CH₃–CHCl–CH₃ (2-cloropropano).","Exceção: HBr na presença de peróxidos faz o contrário (<b>anti-Markovnikov</b>, efeito Kharasch)."]]],
cards:[["Reação de substituição","Um átomo ou grupo sai e outro entra no lugar"],["Reação de adição","A ligação dupla/tripla se quebra e átomos são somados"],["Hidrogenação","Adição de H₂ a alceno ou alcino (catalisador Ni, Pt ou Pd)"],["Regra de Markovnikov","O H se liga ao carbono da dupla mais hidrogenado"],["Nitração do benzeno","Benzeno + HNO₃ → nitrobenzeno (catalisador H₂SO₄)"],["Água de bromo","Perde a cor na presença de ligações duplas ou triplas"],["Orto e para dirigentes","–OH, –NH₂, –CH₃ e halogênios"],["Meta dirigentes","–NO₂, –COOH, –SO₃H"]],
quiz:[
["Qual tipo de reação é típica dos alcanos?","Substituição",["Adição","Hidrogenação","Hidratação"],"Alcanos só têm ligações simples, então trocam um H por outro átomo."],
["Qual tipo de reação é típica dos alcenos?","Adição",["Substituição","Nitração","Sulfonação"],"A dupla ligação se abre e recebe novos átomos."],
["CH₂=CH₂ + H₂ → CH₃–CH₃ é uma reação de:","Hidrogenação (adição)",["Nitração","Sulfonação","Substituição"],"O H₂ se soma à dupla ligação, formando etano."],
["Pela regra de Markovnikov, em CH₂=CH–CH₃ + HCl o produto principal é:","2-cloropropano",["1-cloropropano","Cloroeteno","Propano"],"O H vai para o CH₂ (mais hidrogenado) e o Cl fica no carbono do meio."],
["Qual o produto da nitração do benzeno?","Nitrobenzeno",["Clorobenzeno","Tolueno","Fenol"],"Benzeno + HNO₃ (com H₂SO₄) → nitrobenzeno + H₂O."],
["O grupo –NO₂ no anel benzênico orienta uma nova substituição para a posição:","Meta",["Orto e para","Somente orto","Somente para"],"–NO₂ é meta dirigente."],
["Qual teste identifica a presença de ligação dupla numa substância?","A água de bromo perde a cor",["A água de bromo fica azul","A substância pega fogo","A substância vira sólido"],"O Br₂ avermelhado é consumido na adição à dupla e a solução descora."]],
tf:[["O benzeno prefere reações de substituição, mesmo tendo duplas ligações.",true,"O anel aromático é muito estável (ressonância), então prefere trocar átomos a quebrar as duplas."],["Na reação de adição, um átomo sai da molécula.",false,"Na adição nada sai: átomos são somados. 'Sai um, entra outro' é a substituição."],["A hidrogenação de óleos vegetais é usada para produzir margarina.",true,"A adição de H₂ diminui as duplas ligações e o óleo fica sólido."],["CH₄ + Cl₂ → CH₃Cl + HCl é uma reação de adição.",false,"É substituição: um H do metano foi trocado por um Cl."]],
why:[["Por que alcanos fazem substituição e alcenos fazem adição?","Alcanos só têm ligações simples (saturados): não há como somar átomos, então eles trocam um H. Alcenos têm a dupla ligação, cuja parte mais fraca (ligação pi) se quebra facilmente para receber novos átomos."],["Como lembrar a regra de Markovnikov?","Pense em 'o rico fica mais rico': o hidrogênio do HX vai para o carbono da dupla que já tem mais hidrogênios."]]},

{id:'eq',s:'q',t:'Equilíbrio químico',e:'⚖️',per:'Química B · Equilíbrio e Le Chatelier',
mnem:"Le Chatelier é <b>do contra</b>: o equilíbrio sempre 'foge' da mudança. <b>Colocou</b> substância? Ele consome. <b>Tirou</b>? Ele repõe. <b>Esquentou</b>? Vai pro lado <b>endo</b>. <b>Apertou</b> (pressão)? Vai pro lado com <b>menos mols</b> de gás. <b>Catalisador</b>? Não desloca nada.",
sum:[
["O que é",["Acontece em <b>reações reversíveis</b> (⇌), em sistema fechado.","No equilíbrio, a <b>velocidade da reação direta = velocidade da inversa</b>.","As concentrações ficam <b>constantes</b> (mas não necessariamente iguais!). O equilíbrio é <b>dinâmico</b>: as reações continuam acontecendo."]],
["Constante de equilíbrio (Kc)",["Para aA + bB ⇌ cC + dD: <b>Kc = [C]ᶜ·[D]ᵈ ÷ [A]ᵃ·[B]ᵇ</b> — produtos em cima, reagentes embaixo, elevados aos coeficientes.","<b>Sólidos e líquidos puros não entram</b> na expressão.","Kc > 1: favorece os <b>produtos</b>. Kc < 1: favorece os <b>reagentes</b>.","Para gases também se usa <b>Kp</b>, com pressões parciais.","O valor de Kc <b>só muda com a temperatura</b>."]],
["Princípio de Le Chatelier",["Quando um equilíbrio sofre uma perturbação, ele se <b>desloca para diminuir</b> essa perturbação.","<b>Concentração</b>: adicionar uma substância desloca para o lado <b>oposto</b> a ela; retirar desloca para o <b>lado dela</b>.","<b>Pressão</b> (gases): ↑ pressão desloca para o lado com <b>menos mols</b> de gás; ↓ pressão, para o lado com mais mols.","<b>Temperatura</b>: ↑ temperatura favorece a reação <b>endotérmica</b> (ΔH > 0); ↓ temperatura favorece a <b>exotérmica</b> (ΔH < 0).","<b>Catalisador NÃO desloca</b> o equilíbrio: só faz chegar a ele mais rápido."]],
["pH (equilíbrio iônico da água)",["Na água pura a 25 °C: [H⁺] = [OH⁻] = 10⁻⁷ mol/L, e Kw = 10⁻¹⁴.","<b>pH = –log[H⁺]</b>. pH < 7: ácido; pH = 7: neutro; pH > 7: básico.","pH + pOH = 14 (a 25 °C)."]]],
cards:[["Equilíbrio químico","Velocidade direta = velocidade inversa; concentrações constantes"],["Equilíbrio dinâmico","As reações continuam acontecendo nos dois sentidos"],["Kc","Produtos sobre reagentes, elevados aos coeficientes"],["Kc > 1","Equilíbrio favorece a formação de produtos"],["Princípio de Le Chatelier","O equilíbrio se desloca para diminuir a perturbação"],["Aumento de pressão","Desloca para o lado com menos mols de gás"],["Aumento de temperatura","Favorece a reação endotérmica"],["Catalisador no equilíbrio","Não desloca; só acelera a chegada ao equilíbrio"]],
quiz:[
["O que caracteriza o estado de equilíbrio químico?","Velocidade da reação direta igual à da inversa",["A reação para completamente","Reagentes e produtos ficam com concentrações iguais","Todos os reagentes foram consumidos"],"As concentrações ficam constantes, não necessariamente iguais, e as reações continuam."],
["Em N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g), aumentar a pressão desloca o equilíbrio para:","A direita (formação de NH₃)",["A esquerda","Não desloca","Os dois lados ao mesmo tempo"],"À esquerda há 4 mols de gás (1 + 3) e à direita 2. A pressão favorece o lado com menos mols."],
["Se a reação direta é exotérmica, aumentar a temperatura desloca o equilíbrio para:","Os reagentes (sentido inverso)",["Os produtos (sentido direto)","Nenhum lado","Os dois lados"],"O aumento de temperatura favorece o sentido endotérmico, que aqui é o inverso."],
["O que acontece ao adicionar um catalisador a um sistema em equilíbrio?","O equilíbrio não muda; só é atingido mais rápido",["Desloca para os produtos","Desloca para os reagentes","Aumenta o valor de Kc"],"O catalisador acelera igualmente as reações direta e inversa."],
["Um Kc muito maior que 1 indica que:","No equilíbrio há predomínio de produtos",["Há predomínio de reagentes","A reação não acontece","A reação é sempre rápida"],"Kc grande = numerador (produtos) grande."],
["Qual fator altera o valor numérico de Kc?","Temperatura",["Concentração","Pressão","Catalisador"],"Concentração e pressão deslocam o equilíbrio, mas o Kc só muda com a temperatura."],
["Uma solução com pH = 3 é:","Ácida",["Básica","Neutra","Impossível de existir"],"pH menor que 7 indica solução ácida."]],
tf:[["No equilíbrio, as concentrações de reagentes e produtos são sempre iguais.",false,"Elas são constantes, mas podem ser bem diferentes entre si."],["Sólidos puros não entram na expressão de Kc.",true,"A concentração de um sólido puro é constante, por isso fica fora."],["Retirar um produto desloca o equilíbrio no sentido de formar mais produto.",true,"O equilíbrio tenta repor o que foi retirado."],["O catalisador aumenta o rendimento de uma reação em equilíbrio.",false,"Ele não desloca o equilíbrio; só faz chegar a ele mais rápido."]],
why:[["Por que o equilíbrio é chamado de dinâmico?","Porque as reações não param: reagentes continuam virando produtos e produtos continuam virando reagentes, na mesma velocidade. Por isso as quantidades ficam constantes."],["Na produção de amônia, por que se usa pressão alta?","Porque a reação N₂ + 3 H₂ ⇌ 2 NH₃ vai de 4 mols de gás para 2. Pressão alta desloca o equilíbrio para o lado com menos mols, formando mais amônia."]]},

{id:'hc',s:'q',t:'Hidrocarbonetos',e:'⛽',per:'Química B · Estudo dos hidrocarbonetos',
mnem:"Prefixos: <b>'Mãe, Eu Prometo Buscar Pão'</b> = Met (1), Et (2), Prop (3), But (4), Pent (5). Depois vem Hex (6), Hept (7), Oct (8), Non (9), Dec (10). Infixos: <b>an</b> = só simples, <b>en</b> = dupla, <b>in</b> = tripla. Nome = prefixo + infixo + <b>o</b>.",
sum:[
["O que são",["Compostos formados <b>apenas por carbono e hidrogênio</b>.","Principais fontes: <b>petróleo</b> e gás natural.","São <b>apolares</b>, insolúveis em água e menos densos que ela (por isso o petróleo boia)."]],
["Nomenclatura (IUPAC)",["<b>Prefixo</b> (nº de carbonos) + <b>infixo</b> (tipo de ligação) + <b>sufixo</b> (função; para hidrocarbonetos é <b>-o</b>).","Prefixos: 1 <b>met</b>, 2 <b>et</b>, 3 <b>prop</b>, 4 <b>but</b>, 5 <b>pent</b>, 6 <b>hex</b>, 7 <b>hept</b>, 8 <b>oct</b>, 9 <b>non</b>, 10 <b>dec</b>.","Infixos: <b>an</b> (só simples), <b>en</b> (uma dupla), <b>in</b> (uma tripla), <b>dien</b> (duas duplas).","Ex.: prop + en + o = <b>propeno</b> (CH₂=CH–CH₃)."]],
["Classes",["<b>Alcanos</b>: só ligações simples, cadeia aberta. Fórmula <b>CₙH₂ₙ₊₂</b>. Ex.: metano CH₄ (gás natural); propano e butano (gás de cozinha).","<b>Alcenos</b>: uma dupla ligação. Fórmula <b>CₙH₂ₙ</b>. Ex.: eteno (etileno), que ajuda a amadurecer frutas.","<b>Alcinos</b>: uma tripla ligação. Fórmula <b>CₙH₂ₙ₋₂</b>. Ex.: etino (acetileno), usado em maçaricos de solda.","<b>Alcadienos</b>: duas duplas. Fórmula CₙH₂ₙ₋₂.","<b>Cicloalcanos</b>: cadeia fechada só com ligações simples. Fórmula CₙH₂ₙ. Ex.: ciclo-hexano.","<b>Aromáticos</b>: têm o anel benzênico. Ex.: benzeno C₆H₆, tolueno, naftaleno (naftalina)."]],
["Ramificações",["<b>Cadeia principal</b>: a maior sequência de carbonos que contenha as duplas ou triplas.","Numera-se a partir da ponta mais próxima da insaturação (ou das ramificações).","Radicais: <b>metil</b> (–CH₃), <b>etil</b> (–CH₂–CH₃), <b>propil</b>, <b>isopropil</b>, <b>fenil</b> (anel benzênico).","Ex.: 2-metilbutano."]],
["Petróleo",["Mistura de hidrocarbonetos separada por <b>destilação fracionada</b> (pontos de ebulição diferentes).","Frações: gás (GLP), gasolina, querosene, óleo diesel, óleos lubrificantes, parafina e asfalto.","Quanto <b>maior a cadeia</b>, <b>maior o ponto de ebulição</b>.","A queima de combustíveis fósseis libera CO₂, que intensifica o efeito estufa."]]],
cards:[["Hidrocarboneto","Composto formado apenas por C e H"],["Alcano","Só ligações simples; CₙH₂ₙ₊₂"],["Alceno","Uma ligação dupla; CₙH₂ₙ"],["Alcino","Uma ligação tripla; CₙH₂ₙ₋₂"],["Aromático","Possui anel benzênico"],["Prefixo 'but'","4 carbonos"],["Infixo 'en'","Indica uma ligação dupla"],["Destilação fracionada","Separa as frações do petróleo pelo ponto de ebulição"],["Metano","CH₄, principal componente do gás natural"]],
quiz:[
["Hidrocarbonetos são formados por:","Apenas carbono e hidrogênio",["Carbono, hidrogênio e oxigênio","Apenas carbono","Carbono e nitrogênio"],"Se aparecer outro elemento (O, N, Cl...), já não é hidrocarboneto."],
["Qual é o nome de CH₃–CH₂–CH₃?","Propano",["Etano","Propeno","Butano"],"3 carbonos (prop) + só ligações simples (an) + hidrocarboneto (o)."],
["Qual fórmula geral representa os alcenos?","CₙH₂ₙ",["CₙH₂ₙ₊₂","CₙH₂ₙ₋₂","CₙHₙ"],"Ex.: eteno C₂H₄ (n = 2, H = 4)."],
["O acetileno, usado em maçaricos, é um:","Alcino",["Alcano","Alceno","Aromático"],"Acetileno = etino, HC≡CH, com ligação tripla."],
["O que indica o infixo 'en' no nome but-1-eno?","Uma ligação dupla",["Uma ligação tripla","Só ligações simples","Um anel aromático"],"an = simples, en = dupla, in = tripla."],
["Qual hidrocarboneto é o principal componente do gás natural?","Metano",["Butano","Benzeno","Octano"],"CH₄ — o hidrocarboneto mais simples."],
["Como as frações do petróleo são separadas?","Destilação fracionada",["Filtração","Decantação","Peneiração"],"Cada fração tem uma faixa de ponto de ebulição diferente."],
["O benzeno (C₆H₆) é classificado como:","Hidrocarboneto aromático",["Alcano","Alcino","Cicloalcano"],"Tem o anel benzênico, com duplas ligações alternadas (ressonância)."]],
tf:[["Hidrocarbonetos são muito solúveis em água.",false,"São apolares e a água é polar; por isso óleo e petróleo não se misturam com a água."],["O gás de cozinha (GLP) é formado principalmente por propano e butano.",true,"É o gás liquefeito de petróleo."],["C₂H₂ é um alcano.",false,"C₂H₂ é o etino (alcino), com ligação tripla. O alcano de 2 carbonos é o etano, C₂H₆."],["Quanto maior a cadeia carbônica, maior o ponto de ebulição.",true,"Moléculas maiores interagem mais entre si e precisam de mais energia para ferver."]],
why:[["Por que o petróleo derramado no mar boia?","Porque os hidrocarbonetos são menos densos que a água e não se misturam com ela (são apolares, e a água é polar)."],["Como saber se é alcano, alceno ou alcino só pela fórmula?","Compare com as fórmulas gerais: CₙH₂ₙ₊₂ = alcano; CₙH₂ₙ = alceno (ou cicloalcano); CₙH₂ₙ₋₂ = alcino (ou alcadieno). Ex.: C₃H₈ → 2·3 + 2 = 8 → alcano."]]},

{id:'fun',s:'q',t:'Funções orgânicas',e:'🔍',per:'Química B · Identificação de funções',
mnem:"Olhe a <b>carbonila (C=O)</b>: <b>na ponta</b> = aldeído (-al); <b>no meio</b> = cetona (-ona). C=O com <b>OH</b> junto = <b>ácido</b> (COOH). C=O com O ligado a <b>carbono</b> = <b>éster</b> (COO–C). Oxigênio 'sanduíche' entre carbonos = <b>éter</b>. Tem <b>N</b>? Sem C=O = amina; com C=O = amida.",
sum:[
["Como identificar",["Cada função tem um <b>grupo funcional</b>: o 'pedaço' da molécula que define suas propriedades.","Dica: procure primeiro o <b>oxigênio</b> e o <b>nitrogênio</b> e veja a quem eles estão ligados."]],
["Funções oxigenadas",["<b>Álcool</b>: –OH ligado a carbono <b>saturado</b>. Sufixo <b>-ol</b>. Ex.: etanol CH₃–CH₂–OH.","<b>Fenol</b>: –OH ligado <b>direto ao anel benzênico</b>.","<b>Enol</b>: –OH ligado a carbono de <b>dupla ligação</b> (instável).","<b>Aldeído</b>: carbonila (C=O) na <b>ponta</b> da cadeia: –CHO. Sufixo <b>-al</b>. Ex.: metanal (formol).","<b>Cetona</b>: carbonila <b>no meio</b> da cadeia, entre dois carbonos. Sufixo <b>-ona</b>. Ex.: propanona (acetona).","<b>Ácido carboxílico</b>: –COOH. Nome: ácido ...<b>oico</b>. Ex.: ácido etanoico (vinagre).","<b>Éster</b>: –COO– entre carbonos. Nome: ...<b>ato de</b> ...<b>ila</b>. Ex.: etanoato de etila. Dá aroma a frutas.","<b>Éter</b>: oxigênio <b>entre dois carbonos</b> (C–O–C). Ex.: metoximetano."]],
["Funções nitrogenadas",["<b>Amina</b>: derivada da amônia (NH₃), com N ligado a carbono. Ex.: metilamina CH₃–NH₂. Cheiro de peixe.","<b>Amida</b>: N ligado a uma carbonila (–CO–NH₂). Ex.: ureia.","<b>Nitrila</b>: –C≡N.","<b>Nitrocomposto</b>: –NO₂. Ex.: TNT."]],
["Outras",["<b>Haletos orgânicos</b>: possuem halogênio (F, Cl, Br, I). Ex.: clorometano, CFCs.","Moléculas grandes (remédios, hormônios) têm <b>várias funções ao mesmo tempo</b> — a prova costuma pedir para circular e nomear cada uma."]]],
cards:[["Álcool","–OH ligado a carbono saturado (sufixo -ol)"],["Fenol","–OH ligado diretamente ao anel benzênico"],["Aldeído","Carbonila na ponta da cadeia: –CHO (sufixo -al)"],["Cetona","Carbonila no meio da cadeia (sufixo -ona)"],["Ácido carboxílico","Grupo –COOH (ácido ...oico)"],["Éster","Grupo –COO– entre carbonos; aromas de frutas"],["Éter","Oxigênio entre dois carbonos: C–O–C"],["Amina","Nitrogênio ligado a carbono, derivada da amônia"],["Amida","Nitrogênio ligado a uma carbonila: –CONH₂"]],
quiz:[
["Qual função tem o grupo –OH ligado a um carbono saturado?","Álcool",["Fenol","Enol","Ácido carboxílico"],"Se o –OH estiver no anel benzênico é fenol; se estiver em carbono de dupla, é enol."],
["A acetona (propanona, CH₃–CO–CH₃) pertence à função:","Cetona",["Aldeído","Éster","Éter"],"A carbonila está no meio da cadeia, entre dois carbonos."],
["O vinagre contém ácido acético (ácido etanoico). Qual é o grupo funcional dele?","–COOH (carboxila)",["–CHO","–OH no anel benzênico","C–O–C"],"É o grupo dos ácidos carboxílicos."],
["Os aromas artificiais de frutas costumam ser:","Ésteres",["Aminas","Éteres","Hidrocarbonetos"],"Ex.: o acetato de isoamila tem aroma de banana."],
["A fórmula CH₃–O–CH₃ representa um:","Éter",["Álcool","Cetona","Aldeído"],"O oxigênio está entre dois carbonos."],
["Qual função tem um nitrogênio ligado a uma carbonila (C=O)?","Amida",["Amina","Nitrila","Nitrocomposto"],"Ex.: a ureia. Na amina, o N não está ligado a carbonila."],
["O grupo –CHO caracteriza qual função?","Aldeído",["Cetona","Ácido carboxílico","Álcool"],"Carbonila na ponta da cadeia, com um H ligado."],
["O cheiro característico de peixe vem de compostos da função:","Amina",["Éster","Cetona","Álcool"],"Aminas de cadeia curta têm cheiro forte de peixe."]],
tf:[["O fenol tem o –OH ligado diretamente ao anel benzênico.",true,"É isso que diferencia o fenol do álcool."],["Aldeídos e cetonas possuem o grupo carbonila (C=O).",true,"A diferença é a posição: na ponta (aldeído) ou no meio (cetona)."],["O etanol pertence à função éter.",false,"O etanol (CH₃–CH₂–OH) é um álcool."],["O sufixo '-ona' indica um aldeído.",false,"'-ona' é cetona; aldeído usa o sufixo '-al'."]],
why:[["Como diferenciar aldeído de cetona olhando a fórmula?","Veja onde está o C=O: se o carbono da carbonila estiver na ponta (ligado a um H), é aldeído; se estiver entre dois carbonos, é cetona."],["Como diferenciar ácido carboxílico de éster?","Os dois têm –COO–. No ácido, o segundo oxigênio está ligado a um H (–COOH). No éster, está ligado a um carbono (–COO–C)."]]},

{id:'pol',s:'q',t:'Polímeros',e:'🧴',per:'Química B · Polímeros',
mnem:"<b>Adição</b> = 'abre a dupla e gruda' (nada sobra). <b>Condensação</b> = 'gruda e solta água' (sobra uma molécula pequena). Termo<b>plástico</b> = moldável como massinha (recicla); termo<b>fixo</b> = fica fixo para sempre.",
sum:[
["O que são",["<b>Macromoléculas</b> formadas pela união de muitas moléculas pequenas, os <b>monômeros</b>.","<b>Polimerização</b> é a reação que une os monômeros. 'Poli' = muitos; 'mero' = partes.","Podem ser <b>naturais</b> (amido, celulose, proteínas, borracha natural, DNA) ou <b>sintéticos</b> (plásticos, náilon)."]],
["Polímeros de adição",["Monômeros com <b>dupla ligação</b> (C=C) se unem abrindo a dupla. <b>Nenhuma molécula sobra</b>.","<b>Polietileno (PE)</b>: monômero eteno. Sacolas e garrafas.","<b>Polipropileno (PP)</b>: monômero propeno. Potes e para-choques.","<b>PVC</b>: monômero cloreto de vinila. Canos e tubos.","<b>Poliestireno (PS)</b>: monômero estireno. Isopor e copos descartáveis.","<b>Teflon (PTFE)</b>: monômero tetrafluoroeteno. Antiaderente de panelas.","<b>Borracha natural</b> (poli-isopreno): a <b>vulcanização</b> (adição de enxofre) deixa a borracha mais resistente."]],
["Polímeros de condensação",["Os monômeros se unem <b>liberando uma molécula pequena</b>, geralmente <b>água</b>.","<b>PET</b> (poliéster): garrafas de refrigerante e tecidos.","<b>Náilon</b> (poliamida): tecidos, cordas e cerdas de escova.","<b>Baquelite</b>: cabos de panela e tomadas.","Naturais: proteínas (formadas por aminoácidos), amido e celulose (formados por glicose)."]],
["Propriedades e meio ambiente",["<b>Termoplásticos</b>: amolecem com o calor e podem ser <b>remoldados e reciclados</b> (PE, PP, PVC, PET).","<b>Termofixos</b>: não amolecem depois de prontos e <b>não podem ser remoldados</b> (baquelite).","Plásticos comuns demoram centenas de anos para se decompor: acúmulo de lixo e <b>microplásticos</b> nos oceanos.","Soluções: <b>reciclagem</b>, redução do uso e <b>plásticos biodegradáveis</b>."]]],
cards:[["Monômero","Molécula pequena que se repete para formar o polímero"],["Polímero de adição","Monômeros com dupla ligação se unem sem liberar moléculas"],["Polímero de condensação","Monômeros se unem liberando uma molécula pequena (ex.: água)"],["PVC","Polímero do cloreto de vinila; usado em canos"],["Teflon","Polímero do tetrafluoroeteno; antiaderente"],["PET","Poliéster de condensação; garrafas de refrigerante"],["Termoplástico","Amolece com o calor e pode ser reciclado"],["Termofixo","Não amolece nem pode ser remoldado (ex.: baquelite)"],["Vulcanização","Adição de enxofre à borracha, deixando-a mais resistente"]],
quiz:[
["O que é um monômero?","A unidade pequena que se repete para formar o polímero",["Um polímero muito grande","Um tipo de plástico reciclado","Um catalisador da polimerização"],"Polímero = muitos monômeros unidos."],
["Qual é o monômero do polietileno?","Eteno (etileno)",["Propeno","Cloreto de vinila","Estireno"],"Poli + etileno: muitos etilenos unidos pela abertura da dupla ligação."],
["Na polimerização por condensação:","Há liberação de uma molécula pequena, como a água",["Nenhuma molécula é liberada","Os monômeros precisam ter ligação tripla","Forma-se apenas gás carbônico"],"É a principal diferença em relação à polimerização por adição."],
["O isopor é feito de qual polímero?","Poliestireno expandido",["PVC","Teflon","Náilon"],"O poliestireno recebe gás durante a fabricação e vira espuma."],

{id:'sp',s:'i',t:'Simple Past',e:'⏪',per:'Inglês · Estrutura do passado simples',

sum:[

["Afirmativa",["Sujeito + <b>verbo no passado</b> + complemento.","Regulares: + <b>-ed</b> (play → played). Irregulares: forma própria (go → went).","A forma é <b>igual para todas as pessoas</b>: I/you/he/she/it/we/they <b>played</b>. Não tem -s na 3ª pessoa!"]],

["Interrogativa",["<b>Did</b> + sujeito + <b>verbo na forma base</b> + ?","Ex.: <i><b>Did</b> you <b>watch</b> the movie?</i>","Respostas curtas: <i>Yes, I <b>did</b>.</i> / <i>No, I <b>didn't</b>.</i>","Com palavras interrogativas: <i><b>Where did</b> you <b>go</b>? <b>What did</b> she <b>eat</b>?</i>"]],
["Verbo to be no passado",["O <b>to be</b> é especial: <b>was</b> (I, he, she, it) e <b>were</b> (you, we, they).","Não usa did! Negativa: <i>wasn't / weren't</i>. Pergunta: <i><b>Were</b> you at home?</i>"]]],
cards:[["Simple past","Ações terminadas no passado"],["Did","Auxiliar do passado em perguntas e negativas"],["Didn't","= did not (forma negativa)"],["Yesterday","Ontem"],["Last week","Semana passada"],["Ago","Atrás (two days ago = dois dias atrás)"],["Was","Passado de to be para I, he, she, it"],["Were","Passado de to be para you, we, they"]],

["Qual expressão indica simple past?","Last year",["Tomorrow","Now","Every day"],"Last year = ano passado. Tomorrow é futuro; now e every day, presente."],
["Complete: They ___ at the cinema last night.","were",["was","are","did"],"They usa were no passado do verbo to be."],

{id:'reg',s:'i',t:'Regular verbs',e:'➕',per:'Inglês · Verbos regulares (-ed)',
mnem:"Pronúncia do -ed: depois de <b>T ou D</b> → soa <b>/ɪd/</b> (want-ed, need-ed) e ganha uma sílaba. Nos outros casos o 'e' fica mudo: <b>/t/</b> (worked, watched) ou <b>/d/</b> (played, lived). Escrita: <b>consoante + y → ied</b> (study → studied); <b>vogal + y → yed</b> (play → played).",
sum:[
["Regra geral",["Verbos regulares formam o passado com <b>-ed</b>.","work → work<b>ed</b> · play → play<b>ed</b> · watch → watch<b>ed</b> · clean → clean<b>ed</b>."]],
["Regras de escrita",["Terminado em <b>-e</b>: só acrescenta <b>-d</b>. live → live<b>d</b>, dance → dance<b>d</b>, like → like<b>d</b>.","<b>Consoante + y</b>: troca o y por <b>-ied</b>. study → stud<b>ied</b>, cry → cr<b>ied</b>, try → tr<b>ied</b>.","<b>Vogal + y</b>: só acrescenta -ed. play → play<b>ed</b>, enjoy → enjoy<b>ed</b>.","<b>Consoante–vogal–consoante</b> com a sílaba forte no final: <b>dobra</b> a última consoante. stop → sto<b>pped</b>, plan → pla<b>nned</b>, prefer → prefe<b>rred</b>.","Não dobra se terminar em w, x ou y: snow → snowed, fix → fixed."]],
["Pronúncia do -ed",["<b>/ɪd/</b> (soa 'id'): verbos terminados em som de <b>t</b> ou <b>d</b>. wanted, needed, decided, visited.","<b>/t/</b>: depois de sons 'sem voz' (p, k, s, sh, ch, f). worked, stopped, watched, washed, laughed.","<b>/d/</b>: depois dos demais sons. played, lived, cleaned, called."]],
["Regulares comuns",["ask, arrive, call, clean, close, cook, dance, finish, help, like, listen, live, love, need, open, play, start, stay, study, talk, try, visit, wait, walk, want, watch, work."]]],
cards:[["study (estudar)","studied"],["stop (parar)","stopped"],["live (morar)","lived"],["play (jogar/brincar)","played"],["try (tentar)","tried"],["plan (planejar)","planned"],["watch (assistir)","watched"],["dance (dançar)","danced"],["enjoy (aproveitar)","enjoyed"]],
quiz:[
["Qual é o passado de 'study'?","studied",["studyed","studed","studding"],"Consoante + y: troca o y por -ied."],
["Qual é o passado de 'stop'?","stopped",["stoped","stopt","stopping"],"Stop termina em consoante–vogal–consoante: dobra o p."],
["Qual é o passado de 'dance'?","danced",["danceed","dancied","dancd"],"Verbo terminado em -e: só acrescenta -d."],
["Qual é o passado de 'play'?","played",["plaied","playd","plaid"],"Vogal + y: só acrescenta -ed."],
["Em qual verbo o -ed é pronunciado /ɪd/ (como 'id')?","wanted",["worked","played","watched"],"Depois de t ou d o -ed ganha som de /ɪd/: want-ed."],
["Em qual verbo o -ed tem som de /t/?","watched",["needed","lived","played"],"Depois de sons como ch, o -ed soa /t/: 'watcht'."],
["Qual destes verbos é regular?","work",["go","eat","see"],"Work → worked. Go, eat e see são irregulares."]],
tf:[["O passado de 'try' é 'tryed'.",false,"Consoante + y vira -ied: tried."],["Verbos regulares formam o passado com -ed.",true,"Ex.: walk → walked."],["Em 'needed', o -ed é pronunciado como uma sílaba a mais.",true,"Depois de d (ou t), soa /ɪd/: need-ed."],["O passado de 'plan' é 'planed'.",false,"Plan termina em consoante–vogal–consoante: dobra o n → planned."]],
why:[["Por que 'study' vira 'studied', mas 'play' vira 'played'?","Depende da letra antes do y. Em study, antes do y vem consoante (d), então troca por -ied. Em play, antes do y vem vogal (a), então só acrescenta -ed."],["Por que 'stop' vira 'stopped', com dois p?","Porque termina em consoante–vogal–consoante (t-o-p). Dobrar a consoante mantém o som curto da vogal."]]},

{id:'irr',s:'i',t:'Irregular verbs',e:'🔀',per:'Inglês · Verbos irregulares',
mnem:"Aprenda em <b>grupos</b>! <b>Não mudam</b>: cut, put, hit, let, cost. <b>-ought/-aught</b>: buy → bought, bring → brought, think → thought, teach → taught, catch → caught. <b>i → a</b>: begin → began, drink → drank, sing → sang, swim → swam. <b>-ow → -ew</b>: know → knew, grow → grew, fly → flew. Treine no <b>Desafio dos Verbos</b>!",
sum:[
["O que são",["Verbos irregulares <b>não seguem a regra do -ed</b>: cada um tem sua forma própria no passado.","São os mais usados no dia a dia, por isso aparecem muito em textos e provas.","Precisam ser <b>memorizados</b> — e o jeito mais eficiente é praticar lembrando (flashcards e Desafio dos Verbos), não só lendo a lista."]],
["Os mais cobrados",["be → <b>was/were</b> · have → <b>had</b> · do → <b>did</b> · go → <b>went</b> · get → <b>got</b>","make → <b>made</b> · say → <b>said</b> · see → <b>saw</b> · come → <b>came</b> · take → <b>took</b>","eat → <b>ate</b> · drink → <b>drank</b> · write → <b>wrote</b> · read → <b>read</b> (pronuncia 'red') · speak → <b>spoke</b>","buy → <b>bought</b> · think → <b>thought</b> · know → <b>knew</b> · give → <b>gave</b> · find → <b>found</b>","leave → <b>left</b> · feel → <b>felt</b> · sleep → <b>slept</b> · meet → <b>met</b> · run → <b>ran</b>"]],
["Grupos para memorizar",["<b>Iguais</b>: cut, put, hit, let, cost, shut.","<b>-ought / -aught</b>: bring → brought, buy → bought, think → thought, fight → fought, teach → taught, catch → caught.","<b>i → a</b>: begin → began, drink → drank, sing → sang, swim → swam, ring → rang.","<b>-ee / -ea → -e(p)t</b>: sleep → slept, keep → kept, feel → felt, meet → met, leave → left.","<b>-ow → -ew</b>: know → knew, grow → grew, throw → threw, fly → flew, draw → drew."]],
["Lembre-se",["Na negativa e na pergunta, o irregular também volta à forma base: <i>I <b>went</b>. → I didn't <b>go</b>. → Did you <b>go</b>?</i>"]]],
cards:[["go (ir)","went"],["eat (comer)","ate"],["see (ver)","saw"],["buy (comprar)","bought"],["take (pegar/levar)","took"],["write (escrever)","wrote"],["think (pensar)","thought"],["come (vir)","came"],["make (fazer)","made"],["have (ter)","had"],["drink (beber)","drank"],["know (saber)","knew"]],
quiz:[

["Qual é o passado de 'buy'?","bought",["buyed","brought","buied"],"Buy → bought. Cuidado: brought é o passado de bring (trazer)."],
["Complete: Yesterday I ___ a pizza.","ate",["eated","eat","eats"],"Eat → ate."],
["Qual é o passado de 'see'?","saw",["seed","seen","sees"],"See → saw. (Seen é o particípio.)"],
["Qual verbo NÃO muda no passado?","put",["take","give","run"],"Put → put. Take → took, give → gave, run → ran."],
["Complete: She didn't ___ the letter.","write",["wrote","writed","written"],"Depois de didn't, forma base: write."],

["'I had a dog.' Qual é a forma base do verbo?","have",["had","has","hold"],"Have → had."]],
tf:[["O passado de 'take' é 'took'.",true,"Take → took."],["Todos os verbos em inglês formam o passado com -ed.",false,"Os irregulares têm formas próprias: go → went, eat → ate."],["'Read' no passado se escreve igual, mas se pronuncia 'red'.",true,"Read (/riːd/) → read (/rɛd/)."],["O passado de 'come' é 'comed'.",false,"Come → came."]],
why:[["Por que vale a pena aprender os irregulares em grupos?","Porque o cérebro guarda melhor padrões do que listas soltas. Se você sabe que buy → bought, fica mais fácil lembrar que bring → brought e think → thought."],["Por que 'Did you saw?' está errado?","Porque o did já marca o passado; o verbo deve ficar na forma base: Did you see?"]]},

{id:'rd',s:'i',t:'Interpretação de texto',e:'📖',per:'Inglês · Reading',
mnem:"Antes de ler o texto, <b>leia as perguntas</b>. Depois: <b>1)</b> passe o olho no título e nas imagens (<b>skimming</b>); <b>2)</b> procure no texto as palavras das perguntas (<b>scanning</b>); <b>3)</b> use os <b>cognatos</b> como pistas — mas cuidado com os <b>falsos cognatos</b>!",
sum:[
["Estratégias de leitura",["<b>Leia as perguntas primeiro</b>: assim você já sabe o que procurar.","<b>Skimming</b>: leitura rápida para pegar a <b>ideia geral</b> (título, primeira e última frase de cada parágrafo, imagens).","<b>Scanning</b>: busca rápida por uma <b>informação específica</b> (nome, data, número, lugar).","<b>Palavras-chave</b>: sublinhe as palavras importantes da pergunta e encontre-as (ou sinônimos delas) no texto.","<b>Inferência</b>: às vezes a resposta não está escrita diretamente; use o contexto para deduzir."]],
["Cognatos (amigos)",["Palavras <b>parecidas com o português</b> e com o mesmo significado.","Ex.: <i>important, family, hospital, music, problem, history, different, animal</i>."]],
["Falsos cognatos (cuidado!)",["Parecem português, mas <b>significam outra coisa</b>:","<b>pretend</b> = fingir (não 'pretender') · <b>actually</b> = na verdade (não 'atualmente')","<b>push</b> = empurrar (não 'puxar') · <b>parents</b> = pais (não 'parentes')","<b>library</b> = biblioteca (não 'livraria') · <b>college</b> = faculdade (não 'colégio')","<b>fabric</b> = tecido (não 'fábrica') · <b>lunch</b> = almoço (não 'lanche')"]],
["Pistas no texto",["<b>Conectivos</b> mostram a relação entre as ideias: <b>but / however</b> = contraste; <b>because</b> = causa; <b>so</b> = consequência; <b>and</b> = adição; <b>first, then, finally</b> = sequência.","<b>Referência</b>: pronomes como <i>he, she, it, they</i> retomam algo que já apareceu. Volte no texto e descubra a quem se referem.","<b>Gênero textual</b>: e-mail, notícia, anúncio, quadrinho... o formato ajuda a entender o objetivo do texto."]]],
cards:[["pretend","fingir"],["actually","na verdade"],["push","empurrar"],["parents","pais"],["library","biblioteca"],["college","faculdade"],["however","porém, no entanto"],["because","porque"],["Skimming","Leitura rápida para a ideia geral"],["Scanning","Busca de uma informação específica"]],
quiz:[
["Who went to the beach?","Lucas, Maria and their parents",["Only Lucas and Maria","Lucas and his friends","Maria and her grandparents"],"'Lucas and his sister Maria went to the beach with their parents.' Lembre: parents = pais!",TXT.a],
["Why did they leave home early?","Because the beach was far from their city",["Because it was raining","Because Maria wanted to read","Because they had lunch at 7 a.m."],"O conectivo because mostra a causa: 'because the beach was far from their city'.",TXT.a],
["What did Maria do at the beach?","She read a book",["She swam for an hour","She played volleyball","She slept all day"],"'Maria preferred to read a book under an umbrella.' Quem nadou foi o Lucas.",TXT.a],
["Why did they go back home?","It started to rain",["They were hungry","Lucas was tired","The sea was calm"],"'It started to rain, so they went back home.' So indica consequência.",TXT.a],
["Em 'Lucas swam for an hour, BUT Maria preferred to read', a palavra 'but' indica:","Contraste",["Causa","Consequência","Adição"],"But = mas: mostra ideias opostas (um nadou, a outra preferiu ler).",TXT.a],
["What is the main purpose of the text?","To tell a friend about a trip",["To sell tickets to London","To explain the history of London","To complain about a museum"],"É um e-mail pessoal: Julia conta para Ana sobre a viagem.",TXT.b],
["How long did Julia stay in London?","Five days",["One day","Two weeks","A month"],"'I arrived there on Monday and stayed for five days.'",TXT.b],
["In 'It was enormous!', the word 'It' refers to:","The British Museum",["London","The boat","The gift"],"O pronome it retoma o que foi citado logo antes: the British Museum.",TXT.b],
["The word 'However' in the text expresses:","Contraste",["Causa","Tempo","Adição"],"However = porém. O tempo estava ruim, porém ela amou a cidade.",TXT.b]],
tf:[["'Parents' significa 'parentes' em português.",false,"Parents = pais. Parentes = relatives."],["Skimming é uma leitura rápida para entender a ideia geral.",true,"Já o scanning é a busca por uma informação específica."],["'Actually' significa 'atualmente'.",false,"Actually = na verdade. Atualmente = nowadays ou currently."],["Ler as perguntas antes do texto ajuda a encontrar as respostas.",true,"Você já lê sabendo o que procurar."]],
why:[["Por que é perigoso confiar só nos cognatos?","Porque existem falsos cognatos: palavras parecidas com o português, mas com outro significado (pretend = fingir, push = empurrar). Sempre confira pelo contexto."],["Como descobrir o significado de uma palavra desconhecida sem dicionário?","Use o contexto: veja as palavras ao redor, o assunto do texto, se ela parece com o português e qual a função dela na frase (ação, coisa ou característica)."]]}
