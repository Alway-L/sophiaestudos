  } else if(tab==='cards'){
    body=`<div class="box"><p>São <b>${t.cards.length} cartões</b>. Olhe o termo, <b>tente lembrar o significado</b> e só depois vire o cartão. Seja sincera: os que você errar voltam mais cedo na Revisão do dia.</p>
    <div class="btns"><button class="btn primary full" onclick="startReview(${JSON.stringify(t.cards.map((c,i)=>t.id+':'+i)).replace(/"/g,"'")},'${t.t}')">Começar flashcards</button></div></div>
    <div class="box"><h3>Lista de termos</h3><ul>${t.cards.map(c=>`<li><b>${c[0]}</b> — ${c[1]}</li>`).join('')}</ul></div>`;
  } else if(tab==='quiz'){
    const p=topicPct(t);
    body=`<div class="box"><p><b>${t.quiz.length} questões</b> de múltipla escolha + <b>${t.tf.length}</b> de verdadeiro ou falso. Cada erro vem com explicação.</p><p style="margin-top:6px;color:var(--mute);font-weight:700">Seu recorde: ${p}%</p>
    <div class="btns"><button class="btn primary full" onclick="topicQuiz('${t.id}')">Começar quiz</button></div></div>`;
  } else {
    body=`<p class="intro" style="margin-bottom:10px">Responda com suas palavras (pode ser só de cabeça) e depois compare com a resposta modelo.</p>`+
    t.why.map((w,i)=>`<div class="why" id="w${i}"><h3>${w[0]}</h3><textarea placeholder="Escreva sua explicação aqui..."></textarea><div class="btns"><button class="btn" onclick="this.closest('.why').classList.add('show');addXP(5)">Ver resposta modelo</button></div><div class="ans">✍️ ${w[1]}</div></div>`).join('');
  }
  return `<button class="back" onclick="go('subj','${t.s}')">← ${SUBJ[t.s].n}</button>
  <div class="thead ${t.s}"><p class="k">${SUBJ[t.s].n} · ${t.per}</p><h1>${t.e} ${t.t}</h1></div>
  <div class="tabs">${tabs.map(([k,n])=>`<button class="tab ${k===tab?'on':''}" onclick="go('topic',{id:'${t.id}',tab:'${k}'})">${n}</button>`).join('')}</div>${body}`;
}
function markRead(id){if(!S.read[id]){S.read[id]=1;addXP(5);}}

/* ================== QUIZ ================== */
const mkQ=(tid,x)=>({q:x[0],a:x[1],opts:shuffle([x[1],...x[2]]),exp:x[3],tid});
const mkTF=(tid,x)=>({q:x[0],a:x[1]?'Verdadeiro':'Falso',opts:['Verdadeiro','Falso'],exp:x[2],tid,tf:1});
const allQ=s=>bySubj(s).flatMap(t=>t.quiz.map(x=>mkQ(t.id,x)));
const allTF=s=>bySubj(s).flatMap(t=>t.tf.map(x=>mkTF(t.id,x)));
function topicQuiz(id){const t=T(id);startQuiz({title:t.t,tid:id,qs:[...shuffle(t.quiz.map(x=>mkQ(id,x))),...shuffle(t.tf.map(x=>mkTF(id,x)))],back:()=>go('topic',{id,tab:'quiz'})});}
function startGame(g,s){
  view='games';navOn();const back=()=>go('pick',g);
  if(g==='flash')startQuiz({title:'Quiz Relâmpago',mode:'flash',qs:shuffle([...allQ(s),...allTF(s)]),back});
  else if(g==='vf')startQuiz({title:'Verdadeiro ou Falso',qs:shuffle(allTF(s)).slice(0,10),back});
  else if(g==='sim'){const ts=shuffle(bySubj(s));let qs=[];let k=0;while(qs.length<10){const t=ts[k%ts.length];const pool=t.quiz.filter(x=>!qs.some(q=>q.q===x[0]));if(pool.length)qs.push(mkQ(t.id,shuffle(pool)[0]));k++;}startQuiz({title:'Simulado',qs:shuffle(qs),report:1,back});}
  else if(g==='linha')startLine(s);
  else if(g==='pares')startPairs(s);
  else if(g==='cards')startReview(bySubj(s).flatMap(t=>t.cards.map((c,i)=>t.id+':'+i)),'Flashcards');
}
function startQuiz(o){stopQ();Q=Object.assign({i:0,score:0,wrong:[],combo:0},o);
  if(Q.mode==='flash'){Q.time=60;Q.timer=setInterval(()=>{if(!Q)return;Q.time--;const e=$('#tm');if(e){e.textContent=Q.time;if(Q.time<=10)e.parentNode.classList.add('low')}if(Q.time<=0)endQuiz();},1000);}
  drawQ();window.scrollTo(0,0);}
const tagOf=id=>{const t=T(id);return SUBJ[t.s].e+' '+t.t};
function drawQ(){
  if(!Q)return;if(Q.i>=Q.qs.length)return endQuiz();
  const q=Q.qs[Q.i];Q.ans=false;const n=Q.qs.length;
  app.innerHTML=`<div class="qhead"><button class="ghost" onclick="quitQ()">✕</button><div class="pbar"><i style="width:${Q.mode==='flash'?Q.time/60*100:Q.i/n*100}%"></i></div>${Q.mode==='flash'?`<span class="timer ${Q.time<=10?'low':''}">⏱ <b id="tm">${Q.time}</b>s</span>`:`<span class="count">${Q.i+1}/${n}</span>`}</div>
  <div class="qcard"><p class="qtag">${q.tf?'Verdadeiro ou falso? · ':''}${tagOf(q.tid)}</p><h2 class="q">${q.q}</h2>
  <div class="opts ${q.tf?'tfrow':''}">${q.opts.map((o,k)=>`<button class="opt" onclick="answer(${k})">${q.tf?(k?'❌ ':'✅ '):`<span class="l">${'ABCD'[k]}</span>`}${o}</button>`).join('')}</div><div id="fb"></div></div>
  ${Q.mode==='flash'?`<p class="intro" style="text-align:center;margin-top:12px">Acertos: <b>${Q.score}</b>${Q.combo>1?` · combo x${Q.combo} 🔥`:''}</p>`:''}`;
}
function answer(k){
  if(!Q||Q.ans)return;Q.ans=true;const q=Q.qs[Q.i],ok=q.opts[k]===q.a;
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.a)b.classList.add('right');else if(j===k)b.classList.add('wrong');});
  if(ok){Q.score++;Q.combo++;addXP(Q.mode==='flash'?4+Math.min(Q.combo,6):10);}else{Q.combo=0;Q.wrong.push(q);}
  if(Q.mode==='flash'){Q.i++;setTimeout(()=>{if(Q&&!Q.ended)drawQ()},ok?420:1000);return;}
  const last=Q.i+1>=Q.qs.length;
  $('#fb').innerHTML=`<div class="exp ${ok?'ok':'bad'}"><b>${ok?praise():'Quase! A resposta é: '+q.a}</b>${q.exp}</div><button class="btn primary full" onclick="Q.i++;drawQ();window.scrollTo(0,0)">${last?'Ver resultado':'Próxima →'}</button>`;
  setTimeout(()=>{const f=$('#fb');if(f)f.scrollIntoView({behavior:'smooth',block:'nearest'})},50);
}
function quitQ(){const b=Q&&Q.back;stopQ();b?b():go('home');}
function endQuiz(){
  if(!Q||Q.ended)return;Q.ended=true;clearInterval(Q.timer);
  const n=Q.mode==='flash'?Q.i:Q.qs.length,pct=n?Math.round(Q.score/n*100):0;
  if(Q.tid){S.best[Q.tid]=Math.max(S.best[Q.tid]||0,pct);save();}
  if(Q.report){const by={};Q.qs.forEach(q=>{(by[q.tid]=by[q.tid]||{n:0,ok:0}).n++});Q.qs.forEach(q=>{if(!Q.wrong.includes(q))by[q.tid].ok++});
    Object.keys(by).forEach(id=>{const v=Math.round(by[id].ok/by[id].n*100);S.best[id]=Math.max(S.best[id]||0,Math.min(v,(S.best[id]||0)+20));});save();Q.by=by;}
  if(pct>=70&&n>=3)confetti();
  const msg=Q.mode==='flash'?(Q.score>=12?'Velocidade da luz! ⚡':Q.score>=6?'Muito bom!':'Bora treinar mais um pouco!'):pct===100?'Gabaritou! 🏆':pct>=70?'Mandou muito bem! 🎉':pct>=50?'Tá no caminho certo 💪':'Bora revisar e tentar de novo 📚';
  let rep='';
  if(Q.by){const arr=Object.entries(Q.by).map(([id,v])=>[id,v,v.ok/v.n]).sort((a,b)=>a[2]-b[2]);const weak=arr[0];
    rep=`<div class="report">${arr.map(([id,v])=>`<div class="r">${tagOf(id)}<span style="color:${v.ok===v.n?'var(--ok)':v.ok?'var(--ink)':'var(--bad)'}">${v.ok}/${v.n}</span></div>`).join('')}</div>
    ${weak[2]<1?`<div class="btns"><button class="btn goldb full" onclick="go('topic',{id:'${weak[0]}',tab:'sum'})">Revisar o ponto fraco: ${T(weak[0]).t}</button></div>`:''}`;}
  const B=Q.back;window._back=B;
  app.innerHTML=`<div class="res"><p class="qtag">${Q.title}</p><div class="score" style="--p:${pct}"><div>${Q.mode==='flash'?Q.score:pct+'%'}</div></div>
  <h2 class="serif">${msg}</h2><p>${Q.mode==='flash'?`${Q.score} acertos em ${n} respostas`:`${Q.score} de ${n} corretas`}</p>${rep}
  <div class="btns"><button class="btn primary" onclick="window._back()">Jogar de novo</button><button class="btn" onclick="go('home')">Início</button></div>
  ${Q.wrong.length?`<div class="rev"><h2 class="sec" style="margin-top:20px">Revise seus erros</h2>${Q.wrong.map(q=>`<div class="item"><b>${q.q}</b><div class="a">✓ ${q.a}</div><div class="x">${q.exp}</div></div>`).join('')}</div>`:''}</div>`;
  Q=null;window.scrollTo(0,0);
}

/* ================== FLASHCARDS (repetição espaçada) ================== */
const INT=[0,1,2,4,7,14];
const card=k=>{const[id,i]=k.split(':');const t=T(id);return{t,f:t.cards[+i][0],b:t.cards[+i][1]}};
function dueKeys(){const d=today(),all=TOPICS.flatMap(t=>t.cards.map((c,i)=>t.id+':'+i));const due=all.filter(k=>S.box[k]&&S.box[k].d<=d);const fresh=shuffle(all.filter(k=>!S.box[k])).slice(0,Math.max(0,12-due.length));return shuffle(due).concat(fresh);}
let R=null;
function startReview(keys,title){stopQ();if(!keys.length){app.innerHTML=`<div class="empty"><p style="font-size:44px">🎉</p><h2 class="serif">Tudo revisado por hoje!</h2><p>Volte amanhã para a próxima revisão — ou jogue um quiz enquanto isso.</p><div class="btns"><button class="btn primary" onclick="go('games')">Ir para os jogos</button></div></div>`;return;}
  R={keys:shuffle(keys),i:0,ok:0,title};drawCard();window.scrollTo(0,0);}
function drawCard(){
  if(R.i>=R.keys.length){const p=Math.round(R.ok/R.keys.length*100);if(p>=70)confetti();
    app.innerHTML=`<div class="res"><p class="qtag">${R.title}</p><div class="score" style="--p:${p}"><div>${R.ok}/${R.keys.length}</div></div><h2 class="serif">${p>=70?'Memória afiada! 🧠':'Cada repetição fortalece a memória 💪'}</h2><p>Os cartões que você não lembrou vão aparecer de novo amanhã.</p><div class="btns"><button class="btn primary" onclick="go('home')">Início</button><button class="btn" onclick="go('games')">Jogos</button></div></div>`;R=null;return;}
  const c=card(R.keys[R.i]);
  app.innerHTML=`<div class="qhead"><button class="ghost" onclick="go('home')">✕</button><div class="pbar"><i style="width:${R.i/R.keys.length*100}%"></i></div><span class="count">${R.i+1}/${R.keys.length}</span></div>
  <div class="flip" id="fl" onclick="flipC()"><div class="fc"><div class="face f"><span class="tg">${SUBJ[c.t.s].e} ${c.t.t}</span><div class="t">${c.f}</div><small>Tente lembrar · toque para virar</small></div><div class="face b"><span class="tg">${c.f}</span><div class="d">${c.b}</div></div></div></div>
  <div id="rt"><button class="btn primary full" onclick="flipC()">Virar cartão</button></div>`;
}
function flipC(){const f=$('#fl');if(f.classList.contains('on'))return;f.classList.add('on');$('#rt').innerHTML=`<p class="intro" style="text-align:center;margin-bottom:8px">Você lembrou?</p><div class="rate"><button class="btn no" onclick="rate(0)">😕 Não lembrei</button><button class="btn yes" onclick="rate(1)">😄 Lembrei!</button></div>`;}
function rate(ok){const k=R.keys[R.i],b=S.box[k]?S.box[k].b:0,nb=ok?Math.min(b+1,5):1;S.box[k]={b:nb,d:today()+(ok?INT[nb]:1)};if(ok){R.ok++;addXP(4)}else save();R.i++;drawCard();}

/* ================== LINHA DO TEMPO ================== */
let L=null;
function startLine(s){stopQ();const pool=shuffle(TL.filter(e=>s==='all'||e[2]===s));const pick=[];for(const e of pool){if(pick.length>=5)break;if(!pick.some(p=>p[0]===e[0]))pick.push(e);}L={s,items:shuffle(pick),done:false};drawLine();window.scrollTo(0,0);}
function drawLine(){
  const sorted=L.items.slice().sort((a,b)=>a[0]-b[0]);let right=0;
  const rows=L.items.map((e,i)=>{const ok=L.done&&sorted[i]===e;if(ok)right++;return `<div class="tli ${L.done?(ok?'ok':'bad'):''}"><span class="yr">${e[0]}</span><span>${e[1]}</span>${L.done?'':`<span class="mv"><button onclick="mvL(${i},-1)" ${i?'':'disabled style="opacity:.3"'}>▲</button><button onclick="mvL(${i},1)" ${i<L.items.length-1?'':'disabled style="opacity:.3"'}>▼</button></span>`}</div>`}).join('');
  if(L.done&&!L.paid){L.paid=1;addXP(right*5);if(right===5)confetti();}
  app.innerHTML=`<div class="qhead"><button class="ghost" onclick="go('pick','linha')">✕</button><h2 class="serif" style="font-size:22px">🗓️ Linha do Tempo</h2></div>
  <p class="intro">Organize do <b>mais antigo (topo)</b> para o <b>mais recente</b> usando as setas.</p>
  <div class="tl ${L.done?'done':''}">${rows}</div>
  ${L.done?`<div class="exp ${right===5?'ok':'bad'}"><b>${right===5?'Ordem perfeita! 🎉':right+' de 5 na posição certa'}</b>Ordem correta: ${sorted.map(e=>e[0]+' – '+e[1]).join(' → ')}</div><div class="btns"><button class="btn primary" onclick="startLine(L.s)">Nova rodada</button><button class="btn" onclick="go('home')">Início</button></div>`:`<button class="btn primary full" onclick="L.done=true;drawLine()">Conferir ordem</button>`}`;
}
function mvL(i,d){const j=i+d;[L.items[i],L.items[j]]=[L.items[j],L.items[i]];drawLine();}

/* ================== LIGUE OS PARES ================== */
let P=null;
function startPairs(s){stopQ();const all=bySubj(s).flatMap(t=>t.cards.map(c=>({f:c[0],b:c[1]})));const items=shuffle(all).slice(0,5).map((x,i)=>Object.assign(x,{id:i}));P={s,items,left:shuffle(items),right:shuffle(items),sel:null,done:{},err:0};drawPairs();window.scrollTo(0,0);}
function drawPairs(){
  const n=Object.keys(P.done).length,fin=n===P.items.length;
  app.innerHTML=`<div class="qhead"><button class="ghost" onclick="go('pick','pares')">✕</button><div class="pbar"><i style="width:${n/5*100}%"></i></div><span class="count">${n}/5</span></div>
  <p class="intro">Toque em um <b>conceito</b> e depois no <b>significado</b> certo.</p>
  <div class="pairs"><div class="pcol">${P.left.map(x=>`<button class="pc term ${P.done[x.id]?'ok':''} ${P.sel===x.id?'sel':''}" ${P.done[x.id]?'disabled':''} onclick="selP(${x.id})">${x.f}</button>`).join('')}</div>
  <div class="pcol">${P.right.map(x=>`<button class="pc ${P.done[x.id]?'ok':''}" id="pr${x.id}" ${P.done[x.id]?'disabled':''} onclick="matchP(${x.id})">${x.b}</button>`).join('')}</div></div>
  ${fin?`<div class="exp ok" style="margin-top:16px"><b>${P.err===0?'Sem nenhum erro! 🏆':'Completou!'}</b>${P.err} erro(s) nesta rodada.</div><div class="btns"><button class="btn primary" onclick="startPairs(P.s)">Nova rodada</button><button class="btn" onclick="go('home')">Início</button></div>`:''}`;
}
function selP(id){P.sel=id;drawPairs();}
function matchP(id){if(P.sel===null){toast('Escolha primeiro um conceito à esquerda');return;}
  if(id===P.sel){P.done[id]=1;P.sel=null;addXP(5);const fin=Object.keys(P.done).length===P.items.length;drawPairs();if(fin&&P.err<=1)confetti();}
  else{P.err++;const e=$('#pr'+id);e.classList.remove('no');void e.offsetWidth;e.classList.add('no');}}

(function(){const f=document.querySelector('.bgfx');for(let i=0;i<22;i++){const d=document.createElement('i');d.className='dot';const z=2+Math.random()*4;d.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${10+Math.random()*14}s;animation-delay:-${Math.random()*20}s`;f.appendChild(d);}})();
render();
</script>
</body>
</html>
