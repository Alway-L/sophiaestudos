let S=(()=>{const d=def();try{const o=JSON.parse(localStorage.getItem(KEY)||'{}');const r=Object.assign(d,o);r.cfg=Object.assign({anim:true},o.cfg||{});['errs','exams','best','box','read'].forEach(k=>{if(!r[k]||typeof r[k]!=='object')r[k]={}});if(!r.done||typeof r.done!=='object'||!r.done.k)r.done={d:null,k:{}};return r}catch(e){return d}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
function touch(){const t=today();if(S.last===t)return;S.streak=(S.last===t-1)?S.streak+1:1;S.last=t;}
function addXP(n){S.xp+=n;touch();save();bar();}
const lvl=()=>Math.floor(Math.sqrt(S.xp/60))+1;
const lvlMin=l=>60*(l-1)*(l-1);
const $=s=>document.querySelector(s);
const app=$('#app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const T=id=>TOPICS.find(t=>t.id===id);
const bySubj=s=>s==='all'?TOPICS:TOPICS.filter(t=>t.s===s);
const streakNow=()=>S.last!=null&&S.last>=today()-1?S.streak:0;
function bar(){$('#pStreak').textContent='🔥 '+streakNow();$('#pXp').textContent='⭐ '+S.xp+' XP';}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1600)}
function confetti(){const c=['#F5B942','#F472B6','#E0479A','#C084FC','#FBCFE8'];for(let i=0;i<70;i++){const e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%c.length];e.style.animationDuration=(1.6+Math.random()*1.6)+'s';e.style.animationDelay=Math.random()*.4+'s';e.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(e);setTimeout(()=>e.remove(),3800)}}
const praise=()=>shuffle(['Isso aí!','Mandou bem!','Arrasou!','Exato!','Perfeito!','Boa, Sophia!'])[0];
const topicPct=t=>S.best[t.id]||0;
const subjPct=s=>{const ts=bySubj(s);return Math.round(ts.reduce((a,t)=>a+topicPct(t),0)/ts.length)};
function markDone(k){const t=today();if(S.done.d!==t)S.done={d:t,k:{}};S.done.k[k]=1;save();}
const isDone=k=>S.done.d===today()&&!!S.done.k[k];
function applyCfg(){document.body.classList.toggle('calm',!S.cfg.anim);}
const ICON={
play:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
check:'<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#120D19" stroke-width="3.5"><path d="M5 12l5 5 9-10"/></svg>',
chev:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
err:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F06767" stroke-width="2.2" stroke-linecap="round"><path d="M4 5h11a3 3 0 0 1 3 3v12H7a3 3 0 0 1-3-3z"/><path d="M9 10l4 4M13 10l-4 4"/></svg>',
star:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#F5B942"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z"/></svg>',
cal:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F472B6" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'};

/* ================== PROVAS E PLANO ================== */
const EXAMS=[['h','História'],['g','Geografia'],['qa','Química A'],['qb','Química B'],['i','Inglês']];
const examKey=t=>t.s==='q'?(t.per.indexOf('Química A')===0?'qa':'qb'):t.s;
const subjOfExam=k=>(k==='qa'||k==='qb')?'q':k;
const topicsOfExam=k=>TOPICS.filter(t=>examKey(t)===k);
function daysTo(iso){if(!iso)return null;const p=iso.split('-').map(Number);if(p.length<3||p.some(isNaN))return null;return Date.UTC(p[0],p[1]-1,p[2])/86400000-today();}
const dLabel=d=>d===0?'é hoje!':d===1?'amanhã':`em ${d} dias`;
function upcoming(){return EXAMS.map(([k,n])=>({k,n,d:daysTo(S.exams[k])})).filter(e=>e.d!==null&&e.d>=0).sort((a,b)=>a.d-b.d);}
const examsOfSubj=s=>upcoming().filter(e=>subjOfExam(e.k)===s);
function getPlan(){
  const up=upcoming(),ex=up[0]||null,sig=JSON.stringify(S.exams);
  if(!S.plan||S.plan.d!==today()||S.plan.sig!==sig){
    const items=[{k:'rev',t:'Revisão do dia',s:'',act:"startReview(dueKeys(),'Revisão do dia','rev')"}];
    const pool=ex?topicsOfExam(ex.k):TOPICS;
    const weak=pool.slice().sort((a,b)=>(topicPct(a)-topicPct(b))||((S.read[a.id]?1:0)-(S.read[b.id]?1:0)))[0];
    const rd=!!S.read[weak.id];
    items.push({k:'t:'+weak.id,t:weak.t,s:rd?'Quiz do assunto':'Resumo + flashcards',act:rd?`topicQuiz('${weak.id}')`:`go('topic',{id:'${weak.id}',tab:'sum'})`});
    if(Object.keys(S.errs).length)items.push({k:'err',t:'Caderno de erros',s:'Refazer o que você errou',act:'startErrs()'});
    else if(ex&&subjOfExam(ex.k)==='i')items.push({k:'verbos',t:'Desafio dos Verbos',s:'Jogo',act:'startVerbs()'});
    else{const s=ex?subjOfExam(ex.k):'all';items.push({k:'sim:'+s,t:s==='all'?'Simulado misto':'Simulado de '+SUBJ[s].n,s:'10 questões',act:`startGame('sim','${s}')`});}
    S.plan={d:today(),sig,items};save();
  }
  const items=S.plan.items.map(i=>i.k==='rev'?Object.assign({},i,{s:dueKeys().length+' flashcards'}):i);
  return {ex,up,items};
}

/* ================== NAVEGAÇÃO (com botão voltar) ================== */
let view='home',arg=null,Q=null,R=null,L=null,PR=null,V=null,ignoreHash=false;
function hashOf(v,a){return ({home:'inicio',materias:'materias',games:'jogos',progresso:'progresso',config:'config',erros:'erros'})[v]||(v==='subj'?'materia-'+a:v==='topic'?'topico-'+a.id+'-'+(a.tab||'sum'):v==='pick'?'jogar-'+a:'inicio');}
function setHash(h){if(location.hash!=='#'+h){ignoreHash=true;location.hash=h;}}
function stopAll(){if(Q&&Q.timer)clearInterval(Q.timer);Q=null;R=null;V=null;L=null;PR=null;}
function go(v,a){stopAll();view=v;arg=a;setHash(hashOf(v,a));window.scrollTo(0,0);render();}
function enterGame(){if(Q&&Q.timer)clearInterval(Q.timer);view='game';navOn();setHash('jogando');window.scrollTo(0,0);}
function fromHash(){
  const h=decodeURIComponent(location.hash.slice(1));let v='home',a=null;
  if(['materias','jogos','progresso','config','erros'].includes(h))v=h==='jogos'?'games':h;
  else if(h.indexOf('materia-')===0&&SUBJ[h.slice(8)]){v='subj';a=h.slice(8);}
  else if(h.indexOf('topico-')===0){const p=h.split('-');if(T(p[1])){v='topic';a={id:p[1],tab:p[2]||'sum'};}}
  else if(h.indexOf('jogar-')===0&&GAMES.some(g=>g[0]===h.slice(6))){v='pick';a=h.slice(6);}
  stopAll();view=v;arg=a;window.scrollTo(0,0);render();
}
window.addEventListener('hashchange',()=>{if(ignoreHash){ignoreHash=false;return;}fromHash();});
function navOn(){const n=view==='home'?'home':['materias','subj','topic'].includes(view)?'mat':['games','pick','game'].includes(view)?'games':'prog';document.querySelectorAll('nav.bot button').forEach(b=>b.classList.toggle('on',b.dataset.n===n));}
function render(){bar();applyCfg();const f={home:vHome,materias:vMat,subj:vSubj,topic:vTopic,games:vGames,pick:vPick,progresso:vProg,config:vConfig,erros:vErros}[view]||vHome;app.innerHTML=f();navOn();}

/* ================== TELAS ================== */
function subjCard(s){const p=subjPct(s),e=examsOfSubj(s)[0];return `<button class="sc ${s}" onclick="go('subj','${s}')"><span class="sct"><span class="sce">${SUBJ[s].e}</span>${e?`<span class="scd">${e.d===0?'Hoje':e.d+'d'}</span>`:''}</span><b>${SUBJ[s].n}</b><small>${p}% dominado</small><span class="mini"><i style="width:${p}%"></i></span></button>`}
function errRow(){const n=Object.keys(S.errs).length;return `<button class="row" onclick="go('erros')"><span class="ri" style="background:var(--bads)">${ICON.err}</span><span><b>Caderno de erros</b><small>${n?n+' '+(n===1?'questão':'questões')+' para refazer':'Nenhum erro guardado'}</small></span><span class="chev">${ICON.chev}</span></button>`}
function vHome(){
  const P=getPlan(),ex=P.ex,next=P.items.find(i=>!isDone(i.k)),nd=P.items.filter(i=>isDone(i.k)).length;
  const hr=new Date().getHours(),greet=hr<12?'Bom dia,':hr<18?'Boa tarde,':'Boa noite,';
  const exam=ex?`<div class="exhead"><div><p class="lb">Próxima prova</p><p class="nm">${ex.n}</p></div><div class="num">${ex.d===0?'Hoje':ex.d}<small>${ex.d===0?'boa prova!':ex.d===1?'dia':'dias'}</small></div></div>${P.up.length>1?`<div class="chips2">${P.up.slice(1,4).map(e=>`<span>${e.n} · ${dLabel(e.d)}</span>`).join('')}</div>`:''}`
   :`<div class="exhead"><div><p class="lb">Próxima prova</p><p class="nm">Quando são as provas?</p><p class="exsub">Coloque as datas e o site conta os dias e monta o plano de estudo.</p></div></div><button class="cta2" onclick="go('config')">${ICON.cal} Definir datas das provas</button>`;
  const cta=next?`<button class="cta" onclick="${next.act}"><span><b>Continuar estudando</b><small>${next.t} · ${next.s}</small></span>${ICON.play}</button>`:`<button class="cta" onclick="go('games')"><span><b>Plano de hoje concluído! 🎉</b><small>Que tal um jogo para relaxar?</small></span>${ICON.play}</button>`;
  return `<section class="greet"><p>${greet}</p><h1>Sophia</h1></section>
  <div class="homegrid"><div class="stack">
   <section class="examcard">${exam}${cta}</section>
   <section class="plan2"><div class="hd"><span>Plano de hoje</span><span class="muted">${nd} de ${P.items.length}</span></div>
    ${P.items.map(i=>{const d=isDone(i.k),n=next&&i.k===next.k;return `<button class="pi ${d?'done':''} ${n?'next':''}" onclick="${i.act}"><span class="ck">${d?ICON.check:''}</span><span class="tx">${i.t}<small>${i.s}</small></span><span class="chev">${ICON.chev}</span></button>`}).join('')}
   </section></div>
   <div class="stack">
    <div class="subj4">${['h','g','q','i'].map(subjCard).join('')}</div>
    ${errRow()}
    <button class="row" onclick="go('progresso')"><span class="ri" style="background:var(--golds)">${ICON.star}</span><span><b>Nível ${lvl()}</b><small>${S.xp} XP · ${streakNow()} ${streakNow()===1?'dia seguido':'dias seguidos'}</small></span><span class="chev">${ICON.chev}</span></button>
   </div></div>`;
}
function vMat(){return `<h1 class="pt">Matérias</h1><p class="intro" style="margin:0 2px 14px">Escolha uma matéria para ver os assuntos.</p>
  <div class="subj4 big">${['h','g','q','i'].map(subjCard).join('')}</div>
  <div class="btns"><button class="btn primary" onclick="startGame('sim','all')">📝 Simulado misto</button><button class="btn" onclick="go('erros')">Caderno de erros</button></div>`}
const GAMES=[
 ['flash','⚡','Quiz Relâmpago','60 segundos, quantas você acerta?','#30251A'],
 ['vf','✅','Verdadeiro ou Falso','Ache as pegadinhas','#132D1E'],
 ['linha','🗓️','Linha do Tempo','Coloque os fatos em ordem','var(--pinks)'],
 ['pares','🧩','Ligue os Pares','Conceito ↔ significado','#3A2119'],
 ['sim','📝','Simulado','10 questões + relatório','#11302B'],
 ['cards','🃏','Flashcards','Todos os cartões de uma matéria','#2A2236'],
 ['verbos','✍️','Desafio dos Verbos','Escreva o passado em inglês','#16233F']];
function gamesGrid(){return `<div class="games">${GAMES.map(g=>`<button class="game" onclick="${g[0]==='verbos'?'startVerbs()':`go('pick','${g[0]}')`}"><span class="gi" style="background:${g[4]}">${g[1]}</span><span><b>${g[2]}</b><small>${g[3]}</small></span></button>`).join('')}</div>`}
function vGames(){return `<h1 class="pt">Jogos</h1><p class="intro" style="margin:0 2px 16px">Aprender jogando é praticar a memória sem perceber.</p>${gamesGrid()}
  <h2 class="sec">Como estudar melhor</h2><div class="tips">${TIPS.map(t=>`<details class="tip"><summary><span>${t[0]}</span>${t[1]}</summary><p>${t[2]}</p></details>`).join('')}</div>`}
function vPick(){
  const g=GAMES.find(x=>x[0]===arg);
  return `<button class="back" onclick="go('games')">← Jogos</button>
  <h1 class="pt">${g[1]} ${g[2]}</h1><p class="intro">${g[3]}. Escolha o conteúdo:</p>
  <div class="chips">
   <button class="chip" onclick="startGame('${arg}','all')"><span class="em">✨</span>Tudo misturado</button>
   <button class="chip h" onclick="startGame('${arg}','h')"><span class="em">🏛️</span>Só História</button>
   <button class="chip g" onclick="startGame('${arg}','g')"><span class="em">🌍</span>Só Geografia</button>
   ${arg==='linha'?'':`<button class="chip q" onclick="startGame('${arg}','q')"><span class="em">⚗️</span>Só Química</button><button class="chip i" onclick="startGame('${arg}','i')"><span class="em">🔤</span>Só Inglês</button>`}
  </div>`;
}
function vSubj(){
  const s=arg,ex=examsOfSubj(s);
  return `<button class="back" onclick="go('materias')">← Matérias</button>
  <div class="shead ${s}"><h1>${SUBJ[s].e} ${SUBJ[s].n}</h1><p>${subjPct(s)}% dominado${ex.length?' · '+ex.map(e=>(s==='q'?e.n+' ':'prova ')+dLabel(e.d)).join(' · '):''}</p></div>
  <div class="tlist">${bySubj(s).map(t=>{const p=topicPct(t);return `<button class="trow ${s}" onclick="go('topic',{id:'${t.id}',tab:'sum'})"><span class="em">${t.e}</span><span><b>${t.t}</b><small>${t.per}${S.read[t.id]?' · ✓ lido':''}</small></span><span class="ring" style="background:conic-gradient(var(--${s}) ${p}%,var(--track) 0)"><span style="background:var(--card);width:36px;height:36px;border-radius:50%;display:grid;place-items:center">${p}%</span></span></button>`}).join('')}</div>
  <div class="btns"><button class="btn primary" onclick="startGame('sim','${s}')">📝 Simulado de ${SUBJ[s].n}</button>${s==='i'?`<button class="btn" onclick="startVerbs()">✍️ Desafio dos Verbos</button>`:''}</div>`;
}
function vTopic(){
  const t=T(arg.id),tab=arg.tab||'sum',ek=examKey(t),ed=daysTo(S.exams[ek]);
  const tabs=[['sum','📖 Resumo'],['cards','🃏 Flashcards'],['quiz','❓ Quiz'],['why','💬 Explique']];
  let body='';
  if(tab==='sum'){
    body=(t.mnem?`<div class="mnem"><p class="mt">🧩 Macete para lembrar</p>${t.mnem}</div>`:'')+t.sum.map(([h,l])=>`<div class="box ${t.s}"><h3>${h}</h3><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')+
    `<div class="box" style="background:var(--golds);border-color:rgba(245,185,66,.35)"><b style="color:var(--ink)">Agora feche o resumo e tente lembrar!</b><p style="font-size:15px;margin-top:4px">Ler de novo dá a sensação de que aprendeu, mas é tentando lembrar que a memória fica forte.</p>
    <div class="btns"><button class="btn primary" onclick="markRead('${t.id}');go('topic',{id:'${t.id}',tab:'cards'})">Já li → Flashcards</button><button class="btn" onclick="markRead('${t.id}');go('topic',{id:'${t.id}',tab:'quiz'})">Ir pro Quiz</button></div></div>`;
  } else if(tab==='cards'){
    body=`<div class="box"><p>São <b>${t.cards.length} cartões</b>. Olhe o termo, <b>tente lembrar o significado</b> e só depois vire o cartão. Seja sincera: os que você errar voltam mais cedo na Revisão do dia.</p>
    <div class="btns"><button class="btn primary full" onclick="topicCards('${t.id}')">Começar flashcards</button></div></div>
    <div class="box"><h3>Lista de termos</h3><ul>${t.cards.map(c=>`<li><b>${c[0]}</b> — ${c[1]}</li>`).join('')}</ul></div>`;
  } else if(tab==='quiz'){
    body=`<div class="box"><p><b>${t.quiz.length} questões</b> de múltipla escolha + <b>${t.tf.length}</b> de verdadeiro ou falso. Cada erro vem com explicação e vai para o Caderno de erros.</p><p style="margin-top:6px;color:var(--mute);font-weight:700">Seu recorde: ${topicPct(t)}%</p>
    <div class="btns"><button class="btn primary full" onclick="topicQuiz('${t.id}')">Começar quiz</button></div></div>`;
  } else {
    body=`<p class="intro" style="margin-bottom:10px">Responda com suas palavras (pode ser só de cabeça) e depois compare com a resposta modelo.</p>`+
    t.why.map(w=>`<div class="why"><h3>${w[0]}</h3><textarea placeholder="Escreva sua explicação aqui..."></textarea><div class="btns"><button class="btn" onclick="this.closest('.why').classList.add('show');addXP(5)">Ver resposta modelo</button></div><div class="ans">✍️ ${w[1]}</div></div>`).join('');
  }
  return `<button class="back" onclick="go('subj','${t.s}')">← ${SUBJ[t.s].n}</button>
  <div class="thead ${t.s}"><p class="k">${t.per}</p><h1>${t.e} ${t.t}</h1>${ed!==null&&ed>=0?`<p class="exchip">📅 Prova ${dLabel(ed)}</p>`:''}</div>
  <div class="tabs">${tabs.map(([k,n])=>`<button class="tab ${k===tab?'on':''}" onclick="go('topic',{id:'${t.id}',tab:'${k}'})">${n}</button>`).join('')}</div>${body}`;
}
function markRead(id){if(!S.read[id]){S.read[id]=1;addXP(5);}}
function vProg(){
  const l=lvl(),a=lvlMin(l),b=lvlMin(l+1),p=Math.round((S.xp-a)/(b-a)*100);
  const weak=TOPICS.filter(t=>S.read[t.id]||S.best[t.id]!=null).sort((x,y)=>topicPct(x)-topicPct(y)).slice(0,3);
  return `<h1 class="pt">Progresso</h1>
  <section class="examcard"><div class="exhead"><div><p class="lb">Seu nível</p><p class="nm">Nível ${l}</p></div><div class="num">${streakNow()}<small>${streakNow()===1?'dia seguido':'dias seguidos'}</small></div></div>
   <div class="lvl"><div class="bar"><i style="width:${p}%"></i></div>${S.xp-a}/${b-a} XP</div></section>
  <h2 class="sec">Provas</h2>
  <div class="box">${EXAMS.map(([k,n])=>{const d=daysTo(S.exams[k]);return `<div class="field"><span><b>${n}</b></span><span class="muted">${d===null?'sem data':d<0?'já passou':dLabel(d)}</span></div>`}).join('')}
   <div class="btns"><button class="btn full" onclick="go('config')">📅 Configurar datas das provas</button></div></div>
  ${weak.length?`<h2 class="sec">Pontos fracos</h2><div class="tlist">${weak.map(t=>`<button class="trow ${t.s}" onclick="go('topic',{id:'${t.id}',tab:'sum'})"><span class="em">${t.e}</span><span><b>${t.t}</b><small>${SUBJ[t.s].n} · ${topicPct(t)}%</small></span><span class="chev" style="margin-left:auto">${ICON.chev}</span></button>`).join('')}</div>`:''}
  <h2 class="sec">Matérias</h2>
  ${['h','g','q','i'].map(s=>`<div class="box ${s} pbox"><div class="pbh"><b>${SUBJ[s].e} ${SUBJ[s].n}</b><span>${subjPct(s)}%</span></div>${bySubj(s).map(t=>`<div class="prow"><span>${t.t}</span><span class="pbar2"><i style="width:${topicPct(t)}%;background:var(--${s})"></i></span><span class="pv">${topicPct(t)}%</span></div>`).join('')}</div>`).join('')}
  ${errRow()}`;
}
function vConfig(){
  return `<button class="back" onclick="go('progresso')">← Progresso</button>
  <h1 class="pt">Configurações</h1>
  <h2 class="sec">Datas das provas</h2>

   <p class="note">O site conta os dias sozinho e monta o plano de estudo começando pela prova mais próxima. As datas ficam salvas neste aparelho.</p></div>
  <h2 class="sec">Aparência</h2>
  <div class="box"><div class="field"><span><b>Animações do fundo</b><small>Desligar economiza bateria</small></span><button class="sw ${S.cfg.anim?'on':''}" role="switch" aria-checked="${S.cfg.anim}" aria-label="Animações do fundo" onclick="toggleAnim()"><i></i></button></div></div>
  <h2 class="sec">Dados</h2>
  <div class="box" id="rst"><button class="btn full danger" onclick="askReset()">Apagar todo o progresso</button></div>`;
}
function setExam(k,v){if(v)S.exams[k]=v;else delete S.exams[k];save();render();toast(v?'Data salva! 📅':'Data apagada');}
function toggleAnim(){S.cfg.anim=!S.cfg.anim;save();render();}
function askReset(){$('#rst').innerHTML=`<p style="font-weight:700">Tem certeza? XP, recordes, flashcards e caderno de erros serão apagados. As datas das provas continuam.</p><div class="btns"><button class="btn danger" onclick="doReset()">Sim, apagar</button><button class="btn" onclick="render()">Cancelar</button></div>`;}
function doReset(){const ex=S.exams,cfg=S.cfg;S=def();S.exams=ex;S.cfg=cfg;save();go('home');toast('Progresso apagado');}
function qById(id){const p=id.split(':'),t=T(p[0]);if(!t||!p[1])return null;const i=+p[1].slice(1);if(p[1][0]==='q'&&t.quiz[i])return mkQ(t.id,t.quiz[i],i);if(p[1][0]==='t'&&t.tf[i])return mkTF(t.id,t.tf[i],i);return null;}
function vErros(){
  const ids=Object.keys(S.errs).filter(id=>qById(id));
  if(!ids.length)return `<button class="back" onclick="go('home')">← Início</button><div class="empty"><p style="font-size:44px">📒</p><h2 class="serif">Caderno vazio!</h2><p>Toda questão que você errar nos quizzes vem para cá. Quando acertar, ela sai do caderno.</p><div class="btns"><button class="btn primary" onclick="go('games')">Ir para os jogos</button></div></div>`;
  const by={};ids.forEach(id=>{const s=T(id.split(':')[0]).s;by[s]=(by[s]||0)+1});
  return `<button class="back" onclick="go('home')">← Início</button><h1 class="pt">Caderno de erros</h1><p class="intro" style="margin-bottom:12px">Toda questão que você erra vem para cá. Quando acertar, ela sai do caderno.</p>
  <div class="box">${Object.entries(by).map(([s,n])=>`<div class="field"><span><b>${SUBJ[s].e} ${SUBJ[s].n}</b></span><span class="muted">${n}</span></div>`).join('')}
  <div class="btns"><button class="btn primary full" onclick="startErrs()">Refazer ${Math.min(ids.length,15)} questões</button></div></div>
  <h2 class="sec">Questões guardadas</h2>${ids.slice(0,40).map(id=>{const q=qById(id);return `<div class="item2"><small>${tagOf(q.tid)}</small><b>${q.q}</b></div>`}).join('')}`;
}

/* ================== QUIZ ================== */
const mkQ=(tid,x,i)=>({id:tid+':q'+i,q:x[0],a:x[1],opts:shuffle([x[1],...x[2]]),exp:x[3],tid,p:x[4]});
const mkTF=(tid,x,i)=>({id:tid+':t'+i,q:x[0],a:x[1]?'Verdadeiro':'Falso',opts:['Verdadeiro','Falso'],exp:x[2],tid,tf:1});
const allQ=s=>bySubj(s).flatMap(t=>t.quiz.map((x,i)=>mkQ(t.id,x,i)));
const allTF=s=>bySubj(s).flatMap(t=>t.tf.map((x,i)=>mkTF(t.id,x,i)));
function topicQuiz(id){const t=T(id);startQuiz({title:t.t,tid:id,qs:[...shuffle(t.quiz.map((x,i)=>mkQ(id,x,i))),...shuffle(t.tf.map((x,i)=>mkTF(id,x,i)))],back:()=>go('topic',{id,tab:'quiz'})});}
function topicCards(id){const t=T(id);startReview(t.cards.map((c,i)=>id+':'+i),t.t,'t:'+id);}
function startErrs(){const qs=Object.keys(S.errs).map(qById).filter(Boolean);if(!qs.length){go('erros');return;}startQuiz({title:'Caderno de erros',qs:shuffle(qs).slice(0,15),err:1,back:()=>go('erros')});}
function startGame(g,s){
  const back=()=>go('pick',g);
  if(g==='flash')startQuiz({title:'Quiz Relâmpago',mode:'flash',qs:shuffle([...allQ(s),...allTF(s)]),back});
  else if(g==='vf')startQuiz({title:'Verdadeiro ou Falso',qs:shuffle(allTF(s)).slice(0,10),back});
  else if(g==='sim'){const ts=shuffle(bySubj(s));let qs=[],k=0,guard=0;while(qs.length<10&&guard<300){const t=ts[k%ts.length];const idx=t.quiz.map((x,i)=>i).filter(i=>!qs.some(q=>q.id===t.id+':q'+i));if(idx.length){const i=shuffle(idx)[0];qs.push(mkQ(t.id,t.quiz[i],i));}k++;guard++;}startQuiz({title:'Simulado',qs:shuffle(qs),report:1,subj:s,back});}
  else if(g==='linha')startLine(s);
  else if(g==='pares')startPairs(s);
  else if(g==='cards')startReview(bySubj(s).flatMap(t=>t.cards.map((c,i)=>t.id+':'+i)),'Flashcards');
}
function startQuiz(o){enterGame();Q=Object.assign({i:0,score:0,wrong:[],combo:0},o);
  if(Q.mode==='flash'){Q.time=60;Q.timer=setInterval(()=>{if(!Q)return;Q.time--;const e=$('#tm');if(e){e.textContent=Q.time;if(Q.time<=10)e.parentNode.classList.add('low')}if(Q.time<=0)endQuiz();},1000);}
  drawQ();}
const tagOf=id=>{const t=T(id);return SUBJ[t.s].e+' '+t.t};
function drawQ(){
  if(!Q)return;if(Q.i>=Q.qs.length)return endQuiz();
  const q=Q.qs[Q.i];Q.ans=false;const n=Q.qs.length;
  app.innerHTML=`<div class="qhead"><button class="ghost" aria-label="Sair" onclick="quitQ()">✕</button><div class="pbar"><i style="width:${Q.mode==='flash'?Q.time/60*100:Q.i/n*100}%"></i></div>${Q.mode==='flash'?`<span class="timer ${Q.time<=10?'low':''}">⏱ <b id="tm">${Q.time}</b>s</span>`:`<span class="count">${Q.i+1}/${n}</span>`}</div>
  <div class="qcard"><p class="qtag">${q.tf?'Verdadeiro ou falso? · ':''}${tagOf(q.tid)}${S.errs[q.id]?' · 📒 do caderno':''}</p>${q.p?`<div class="pass">${q.p}</div>`:''}<h2 class="q">${q.q}</h2>
  <div class="opts ${q.tf?'tfrow':''}">${q.opts.map((o,k)=>`<button class="opt" onclick="answer(${k})">${q.tf?(k?'❌ ':'✅ '):`<span class="l">${'ABCD'[k]}</span>`}${o}</button>`).join('')}</div><div id="fb"></div></div>
  ${Q.mode==='flash'?`<p class="intro" style="text-align:center;margin-top:12px">Acertos: <b>${Q.score}</b>${Q.combo>1?` · combo x${Q.combo} 🔥`:''}</p>`:''}`;
}
function answer(k){
  if(!Q||Q.ans)return;Q.ans=true;const q=Q.qs[Q.i],ok=q.opts[k]===q.a;
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.a)b.classList.add('right');else if(j===k)b.classList.add('wrong');});
  if(ok){Q.score++;Q.combo++;if(S.errs[q.id]){delete S.errs[q.id];Q.fixed=(Q.fixed||0)+1;}addXP(Q.mode==='flash'?4+Math.min(Q.combo,6):10);}
  else{Q.combo=0;Q.wrong.push(q);S.errs[q.id]=(S.errs[q.id]||0)+1;save();}
  if(Q.mode==='flash'){Q.i++;setTimeout(()=>{if(Q&&!Q.ended)drawQ()},ok?420:1000);return;}
  const last=Q.i+1>=Q.qs.length;
  $('#fb').innerHTML=`<div class="exp ${ok?'ok':'bad'}"><b>${ok?praise():'Quase! A resposta é: '+q.a}</b>${q.exp}</div><button class="btn primary full" onclick="Q.i++;drawQ();window.scrollTo(0,0)">${last?'Ver resultado':'Próxima →'}</button>`;
  setTimeout(()=>{const f=$('#fb');if(f)f.scrollIntoView({behavior:'smooth',block:'nearest'})},50);
}
function quitQ(){const b=Q&&Q.back;stopAll();b?b():go('home');}
function endQuiz(){
  if(!Q||Q.ended)return;Q.ended=true;clearInterval(Q.timer);
  const n=Q.mode==='flash'?Q.i:Q.qs.length,pct=n?Math.round(Q.score/n*100):0;
  if(Q.tid){S.best[Q.tid]=Math.max(S.best[Q.tid]||0,pct);markDone('t:'+Q.tid);}
  if(Q.err)markDone('err');
  if(Q.report){const by={};Q.qs.forEach(q=>{(by[q.tid]=by[q.tid]||{n:0,ok:0}).n++});Q.qs.forEach(q=>{if(!Q.wrong.includes(q))by[q.tid].ok++});
    Object.keys(by).forEach(id=>{const v=Math.round(by[id].ok/by[id].n*100);S.best[id]=Math.max(S.best[id]||0,Math.min(v,(S.best[id]||0)+20));});Q.by=by;markDone('sim:'+Q.subj);}
  save();
  if(pct>=70&&n>=3)confetti();
  const msg=Q.mode==='flash'?(Q.score>=12?'Velocidade da luz! ⚡':Q.score>=6?'Muito bom!':'Bora treinar mais um pouco!'):pct===100?'Gabaritou! 🏆':pct>=70?'Mandou muito bem! 🎉':pct>=50?'Tá no caminho certo 💪':'Bora revisar e tentar de novo 📚';
  let rep='';
  if(Q.by){const arr=Object.entries(Q.by).map(([id,v])=>[id,v,v.ok/v.n]).sort((a,b)=>a[2]-b[2]);const weak=arr[0];
    rep=`<div class="report">${arr.map(([id,v])=>`<div class="r">${tagOf(id)}<span style="color:${v.ok===v.n?'var(--ok)':v.ok?'var(--ink)':'var(--bad)'}">${v.ok}/${v.n}</span></div>`).join('')}</div>
    ${weak[2]<1?`<div class="btns"><button class="btn goldb full" onclick="go('topic',{id:'${weak[0]}',tab:'sum'})">Revisar o ponto fraco: ${T(weak[0]).t}</button></div>`:''}`;}
  window._back=Q.back||(()=>go('home'));
  app.innerHTML=`<div class="res"><p class="qtag">${Q.title}</p><div class="score" style="--p:${pct}"><div>${Q.mode==='flash'?Q.score:pct+'%'}</div></div>
  <h2 class="serif">${msg}</h2><p>${Q.mode==='flash'?`${Q.score} acertos em ${n} respostas`:`${Q.score} de ${n} corretas`}</p>
  ${Q.fixed?`<p style="color:var(--ok);margin-top:6px">📒 ${Q.fixed} ${Q.fixed===1?'questão saiu':'questões saíram'} do caderno de erros!</p>`:''}${rep}
  <div class="btns"><button class="btn primary" onclick="window._back()">${Q.err?'Voltar ao caderno':'Jogar de novo'}</button><button class="btn" onclick="go('home')">Início</button></div>
  ${Q.wrong.length?`<div class="rev"><h2 class="sec" style="margin-top:20px">Revise seus erros</h2><p class="intro" style="margin-bottom:10px">Eles foram guardados no Caderno de erros.</p>${Q.wrong.map(q=>`<div class="item"><b>${q.q}</b><div class="a">✓ ${q.a}</div><div class="x">${q.exp}</div></div>`).join('')}</div>`:''}</div>`;
  Q=null;window.scrollTo(0,0);
}

/* ================== FLASHCARDS (repetição espaçada) ================== */
const INT=[0,1,2,4,7,14];
const card=k=>{const[id,i]=k.split(':');const t=T(id);return{t,f:t.cards[+i][0],b:t.cards[+i][1]}};
function dueKeys(){const d=today(),all=TOPICS.flatMap(t=>t.cards.map((c,i)=>t.id+':'+i));const due=all.filter(k=>S.box[k]&&S.box[k].d<=d);const fresh=shuffle(all.filter(k=>!S.box[k])).slice(0,Math.max(0,12-due.length));return shuffle(due).concat(fresh);}
function startReview(keys,title,kind){enterGame();if(!keys.length){if(kind)markDone(kind);app.innerHTML=`<div class="empty"><p style="font-size:44px">🎉</p><h2 class="serif">Tudo revisado por hoje!</h2><p>Volte amanhã para a próxima revisão — ou jogue um quiz enquanto isso.</p><div class="btns"><button class="btn primary" onclick="go('games')">Ir para os jogos</button></div></div>`;return;}
  R={keys:shuffle(keys),i:0,ok:0,title,kind};drawCard();}
function drawCard(){
  if(!R)return;
  if(R.i>=R.keys.length){const p=Math.round(R.ok/R.keys.length*100);if(R.kind)markDone(R.kind);if(p>=70)confetti();
    app.innerHTML=`<div class="res"><p class="qtag">${R.title}</p><div class="score" style="--p:${p}"><div>${R.ok}/${R.keys.length}</div></div><h2 class="serif">${p>=70?'Memória afiada! 🧠':'Cada repetição fortalece a memória 💪'}</h2><p>Os cartões que você não lembrou vão aparecer de novo amanhã.</p><div class="btns"><button class="btn primary" onclick="go('home')">Início</button><button class="btn" onclick="go('games')">Jogos</button></div></div>`;R=null;return;}
  const c=card(R.keys[R.i]);
  app.innerHTML=`<div class="qhead"><button class="ghost" aria-label="Sair" onclick="go('home')">✕</button><div class="pbar"><i style="width:${R.i/R.keys.length*100}%"></i></div><span class="count">${R.i+1}/${R.keys.length}</span></div>
  <div class="flip" id="fl" onclick="flipC()"><div class="fc"><div class="face f"><span class="tg">${SUBJ[c.t.s].e} ${c.t.t}</span><div class="t">${c.f}</div><small>Tente lembrar · toque para virar</small></div><div class="face b"><span class="tg">${c.f}</span><div class="d">${c.b}</div></div></div></div>
  <div id="rt"><button class="btn primary full" onclick="flipC()">Virar cartão</button></div>`;
}
function flipC(){const f=$('#fl');if(!f||f.classList.contains('on'))return;f.classList.add('on');$('#rt').innerHTML=`<p class="intro" style="text-align:center;margin-bottom:8px">Você lembrou?</p><div class="rate"><button class="btn no" onclick="rate(0)">😕 Não lembrei</button><button class="btn yes" onclick="rate(1)">😄 Lembrei!</button></div>`;}
function rate(ok){if(!R)return;const k=R.keys[R.i],b=S.box[k]?S.box[k].b:0,nb=ok?Math.min(b+1,5):1;S.box[k]={b:nb,d:today()+(ok?INT[nb]:1)};if(ok){R.ok++;addXP(4)}else save();R.i++;drawCard();}

/* ================== LINHA DO TEMPO ================== */
function startLine(s){enterGame();const pool=shuffle(TL.filter(e=>s==='all'||e[2]===s));const pick=[];for(const e of pool){if(pick.length>=5)break;if(!pick.some(p=>p[0]===e[0]))pick.push(e);}L={s,items:shuffle(pick),done:false};drawLine();}
function drawLine(){
  if(!L)return;const sorted=L.items.slice().sort((a,b)=>a[0]-b[0]);let right=0;
  const rows=L.items.map((e,i)=>{const ok=L.done&&sorted[i]===e;if(ok)right++;return `<div class="tli ${L.done?(ok?'ok':'bad'):''}"><span class="yr">${e[0]}</span><span>${e[1]}</span>${L.done?'':`<span class="mv"><button aria-label="Subir" onclick="mvL(${i},-1)" ${i?'':'disabled style="opacity:.3"'}>▲</button><button aria-label="Descer" onclick="mvL(${i},1)" ${i<L.items.length-1?'':'disabled style="opacity:.3"'}>▼</button></span>`}</div>`}).join('');
  if(L.done&&!L.paid){L.paid=1;addXP(right*5);if(right===5)confetti();}
  app.innerHTML=`<div class="qhead"><button class="ghost" aria-label="Sair" onclick="go('pick','linha')">✕</button><h2 class="serif" style="font-size:22px">🗓️ Linha do Tempo</h2></div>
  <p class="intro">Organize do <b>mais antigo (topo)</b> para o <b>mais recente</b> usando as setas.</p>
  <div class="tl ${L.done?'done':''}">${rows}</div>
  ${L.done?`<div class="exp ${right===5?'ok':'bad'}"><b>${right===5?'Ordem perfeita! 🎉':right+' de 5 na posição certa'}</b>Ordem correta: ${sorted.map(e=>e[0]+' – '+e[1]).join(' → ')}</div><div class="btns"><button class="btn primary" onclick="startLine(L.s)">Nova rodada</button><button class="btn" onclick="go('home')">Início</button></div>`:`<button class="btn primary full" onclick="L.done=true;drawLine()">Conferir ordem</button>`}`;
}
function mvL(i,d){const j=i+d;[L.items[i],L.items[j]]=[L.items[j],L.items[i]];drawLine();}

/* ================== LIGUE OS PARES ================== */
function startPairs(s){enterGame();const all=bySubj(s).flatMap(t=>t.cards.map(c=>({f:c[0],b:c[1]})));const items=shuffle(all).slice(0,5).map((x,i)=>Object.assign(x,{id:i}));PR={s,items,left:shuffle(items),right:shuffle(items),sel:null,done:{},err:0};drawPairs();}
function drawPairs(){
  if(!PR)return;const n=Object.keys(PR.done).length,fin=n===PR.items.length;
  app.innerHTML=`<div class="qhead"><button class="ghost" aria-label="Sair" onclick="go('pick','pares')">✕</button><div class="pbar"><i style="width:${n/5*100}%"></i></div><span class="count">${n}/5</span></div>
  <p class="intro">Toque em um <b>conceito</b> e depois no <b>significado</b> certo.</p>
  <div class="pairs"><div class="pcol">${PR.left.map(x=>`<button class="pc term ${PR.done[x.id]?'ok':''} ${PR.sel===x.id?'sel':''}" ${PR.done[x.id]?'disabled':''} onclick="selP(${x.id})">${x.f}</button>`).join('')}</div>
  <div class="pcol">${PR.right.map(x=>`<button class="pc ${PR.done[x.id]?'ok':''}" id="pr${x.id}" ${PR.done[x.id]?'disabled':''} onclick="matchP(${x.id})">${x.b}</button>`).join('')}</div></div>
  ${fin?`<div class="exp ok" style="margin-top:16px"><b>${PR.err===0?'Sem nenhum erro! 🏆':'Completou!'}</b>${PR.err} erro(s) nesta rodada.</div><div class="btns"><button class="btn primary" onclick="startPairs(PR.s)">Nova rodada</button><button class="btn" onclick="go('home')">Início</button></div>`:''}`;
}
function selP(id){PR.sel=id;drawPairs();}
function matchP(id){if(PR.sel===null){toast('Escolha primeiro um conceito à esquerda');return;}
  if(id===PR.sel){PR.done[id]=1;PR.sel=null;addXP(5);const fin=Object.keys(PR.done).length===PR.items.length;drawPairs();if(fin&&PR.err<=1)confetti();}
  else{PR.err++;const e=$('#pr'+id);e.classList.remove('no');void e.offsetWidth;e.classList.add('no');}}

/* ================== DESAFIO DOS VERBOS ================== */
function startVerbs(){enterGame();V={items:shuffle(VERBS).slice(0,10),i:0,ok:0,wrong:[],ans:false};drawV();}
function drawV(){
  if(!V)return;
  if(V.i>=V.items.length){const p=V.ok*10;markDone('verbos');if(p>=70)confetti();
    app.innerHTML=`<div class="res"><p class="qtag">Desafio dos Verbos</p><div class="score" style="--p:${p}"><div>${V.ok}/10</div></div><h2 class="serif">${p===100?'Gabaritou! 🏆':p>=70?'Mandou bem! 🎉':'Bora treinar mais! 💪'}</h2>
    <div class="btns"><button class="btn primary" onclick="startVerbs()">Jogar de novo</button><button class="btn" onclick="go('topic',{id:'irr',tab:'sum'})">Ver lista</button></div>
    ${V.wrong.length?`<div class="rev"><h2 class="sec" style="margin-top:20px">Revise</h2>${V.wrong.map(w=>`<div class="item"><b>${w[0]} (${w[2]})</b><div class="a">✓ ${w[1]}</div><div class="x">Você escreveu: ${w[3]||'(em branco)'}</div></div>`).join('')}</div>`:''}</div>`;V=null;return;}
  const v=V.items[V.i];V.ans=false;
  app.innerHTML=`<div class="qhead"><button class="ghost" aria-label="Sair" onclick="go('games')">✕</button><div class="pbar"><i style="width:${V.i*10}%"></i></div><span class="count">${V.i+1}/10</span></div>
  <div class="qcard"><p class="qtag">✍️ Escreva o passado (simple past)</p><div class="vbase">${v[0]}</div><p class="vpt">${v[2]}</p>
  <form onsubmit="event.preventDefault();checkV()"><input class="vin" id="vin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="digite aqui..." aria-label="Passado de ${v[0]}"><button class="btn primary full" style="margin-top:12px" id="vbtn">Conferir</button></form><div id="fb"></div></div>`;
  setTimeout(()=>{const e=$('#vin');if(e)e.focus()},50);
}
function checkV(){
  if(!V)return;if(V.ans){V.i++;drawV();return;}
  const v=V.items[V.i],inp=$('#vin'),val=inp.value.trim().toLowerCase();
  const ok=v[1].split('/').includes(val)||val===v[1];
  V.ans=true;inp.classList.add(ok?'ok':'bad');inp.readOnly=true;
  if(ok){V.ok++;addXP(8);}else V.wrong.push([v[0],v[1],v[2],val]);
  const reg=v[1]===v[0]+'ed'||v[1]===v[0]+'d'||/ied$|([bcdfgklmnprstvz])\1ed$/.test(v[1]);
  $('#fb').innerHTML=`<div class="exp ${ok?'ok':'bad'}"><b>${ok?praise():'Resposta: '+v[1]}</b>${v[0]} → ${v[1]} · verbo ${reg?'regular':'irregular'}</div>`;
  $('#vbtn').textContent=V.i+1<V.items.length?'Próximo →':'Ver resultado';
}

(function(){const f=document.querySelector('.bgfx');for(let i=0;i<22;i++){const d=document.createElement('i');d.className='dot';const z=2+Math.random()*4;d.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${10+Math.random()*14}s;animation-delay:-${Math.random()*20}s`;f.appendChild(d);}})();
fromHash();

</script>
</body>
